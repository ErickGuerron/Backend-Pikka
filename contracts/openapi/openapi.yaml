openapi: 3.0.3
info:
  title: Pikka API
  version: 1.0.0
  description: |
    API pública REST/JSON expuesta por el API Gateway. Clientes: aplicación web
    (React) y aplicación móvil (React Native, clientes y repartidores). Los
    microservicios internos no son accesibles directamente.

    Fase 1 cubre autenticación y usuarios. Pedidos, zonas, rutas, repartidores y
    seguimiento se agregan en las fases siguientes. El MVP del cliente
    (ADR 0006, ADR 0007, ADR 0008) agrega el signup público de CUSTOMER.
servers:
  - url: /
    description: Este API Gateway
tags:
  - name: health
    description: Liveness y readiness del Gateway
  - name: auth
    description: Inicio de sesión e identidad actual
  - name: users
    description: Administración de usuarios y roles
  - name: customers
    description: Consulta de clientes (solo ADMIN)
  - name: orders
    description: Registro y consulta de pedidos
  - name: zones
    description: Zonas de reparto y clasificación de coordenadas
  - name: products
    description: Catálogo de productos y stock (ADR 0009)
  - name: drivers
    description: Rutas del repartidor (ADR 0007). Solo rol DRIVER. Hoy responden 501 hasta que existan el Routing Service y el Tracking Service
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: El proceso está vivo
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /ready:
    get:
      tags: [health]
      operationId: getReady
      summary: El Gateway y sus dependencias pueden recibir tráfico
      security: []
      responses:
        "200":
          description: Listo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Alguna dependencia no está lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y obtiene un token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Devuelve el usuario autenticado
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signupCustomer
      summary: Registra un cliente y devuelve un token de acceso (rol CUSTOMER)
      description: |
        Endpoint público para que un cliente se registre de forma autónoma desde
        la app móvil. No requiere JWT. Protegido por rate limit por IP
        (SIGNUP_RATE_PER_MINUTE, default 10/min).

        El token emitido sirve para `GET /api/v1/auth/me` y devuelve
        `role: "CUSTOMER"`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 72, description: Máximo 72 bytes (límite de bcrypt) }
                fullName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "201":
          description: Cliente registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Lista todos los usuarios (solo ADMIN)
      description: Sin filtros ni paginación; el filtrado por rol (p. ej. CUSTOMER) lo hace el cliente.
      responses:
        "200":
          description: Usuarios
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      summary: Crea un usuario (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Obtiene un usuario (ADMIN, OPERATOR o el propio usuario)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Edita nombre y/o rol de un usuario (solo ADMIN)
      description: |
        Los campos ausentes no cambian. Reglas: el rol CUSTOMER es inmutable y no se asigna
        por esta vía; el último ADMIN activo no puede dejar de serlo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Regla de negocio incumplida (p. ej. dejar sin ADMIN activo o cambiar un CUSTOMER)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [users]
      operationId: deactivateUser
      summary: Desactiva un usuario (borrado lógico, solo ADMIN)
      description: |
        Marca active=false y devuelve el usuario. Idempotente. Un ADMIN no puede desactivarse
        a sí mismo ni dejar el sistema sin ADMIN activo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Usuario desactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Regla de negocio incumplida (auto-desactivación o último ADMIN activo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Lista clientes paginados (solo ADMIN)
      description: Orden estable por fecha de creación e id.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, maximum: 100, default: 50 }
          description: Máximo de clientes a devolver. 0 o ausente usa 50; un valor mayor a 100 se limita a 100.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CustomerStatus" }
          description: Filtro opcional por estado.
      responses:
        "200":
          description: Página de clientes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/customers/{id}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Obtiene un cliente por id (solo ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/customers/{id}/status:
    patch:
      tags: [customers]
      operationId: setCustomerStatus
      summary: Cambia el estado de un cliente (solo ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVO, BLOQUEADO_POR_SALDO, BLOQUEADO_POR_INCIDENCIAS] }
      responses:
        "200":
          description: Cliente con el nuevo estado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Lista pedidos (ADMIN u OPERATOR)
      description: |
        Contrato de Sprint 1; transporte implementado en Sprint 2.
        DRIVER no tiene acceso. El filtrado por alcance se define con el rol CUSTOMER.
        Orden descendente por createdAt y ascendente por id en empates.
        Sin resultados devuelve un arreglo vacío.
      parameters:
        - name: deliveryDate
          in: query
          schema: { type: string, format: date }
          description: Filtra por fecha de entrega, independientemente de createdAt.
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Pedidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [orders]
      operationId: createOrder
      summary: Registra un pedido del cliente autenticado (solo CUSTOMER)
      description: |
        El servidor asigna id, createdAt y el estado. La validación automática (ADR 0007)
        consulta la zona de la dirección y el estado del cliente. Si alguna regla no se
        cumple, el pedido queda en PENDING_REVIEW con reviewReasons; si no, en PENDING.
        Una dirección fuera de zona no es un error: el pedido entra a la cola de excepciones.
        La fecha de entrega debe ser hoy o posterior en la zona horaria de operación.
        La ventana no cruza medianoche: windowEnd debe ser posterior a windowStart.
        Si Zone Service no responde, no se registra el pedido y se devuelve 503.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Pedido registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Zone Service no disponible; el pedido no se registró
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/orders/mine:
    get:
      tags: [orders]
      operationId: listMyOrders
      summary: Lista los pedidos del cliente autenticado (solo CUSTOMER)
      description: |
        Solo devuelve pedidos del cliente de la sesión; nunca de otros clientes (BOLA, ADR 0007).
        Orden descendente por createdAt y ascendente por id en empates. Sin pedidos devuelve un arreglo vacío.
      responses:
        "200":
          description: Pedidos del cliente
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Obtiene un pedido (ADMIN u OPERATOR)
      description: Contrato de Sprint 1; transporte implementado en Sprint 2.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notifications/mine:
    get:
      tags: [orders]
      operationId: listMyNotifications
      summary: Lista los avisos del cliente autenticado (solo CUSTOMER)
      description: |
        Avisos sobre la revisión de sus pedidos (ADR 0007, sección 3): pedido en revisión, confirmado,
        corregido o rechazado. Del más reciente al más antiguo. Solo devuelve avisos de la sesión.
      responses:
        "200":
          description: Avisos del cliente
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orders/exceptions:
    get:
      tags: [orders]
      operationId: listOrderExceptions
      summary: Cola de excepciones de pedidos pendientes de revisión (ADMIN u OPERATOR)
      description: Pedidos cuya validación automática no se cumplió (ADR 0007, sección 3). El operador los confirma, corrige o rechaza.
      responses:
        "200":
          description: Pedidos en revisión
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orders/{id}/review:
    post:
      tags: [orders]
      operationId: reviewOrder
      summary: Confirma, corrige o rechaza un pedido en revisión (ADMIN u OPERATOR)
      description: Solo aplica a pedidos en estado PENDING_REVIEW. Toda decisión queda registrada con motivo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderReviewRequest" }
      responses:
        "200":
          description: Pedido actualizado según la decisión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelMyOrder
      summary: Cancela un pedido propio del cliente (solo CUSTOMER)
      description: |
        Solo aplica a pedidos en PENDING o ROUTE_ASSIGNED (ADR 0007, sección 8). El stock de sus productos
        vuelve al catálogo en la misma operación. Un pedido de otro cliente responde 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pedido cancelado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/zones:
    get:
      tags: [zones]
      operationId: listZones
      summary: Lista todas las zonas (ADMIN u OPERATOR)
      responses:
        "200":
          description: Zonas registradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [zones]
      operationId: createZone
      summary: Registra una zona (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateZoneRequest" }
      responses:
        "201":
          description: Zona creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/zones/classify:
    get:
      tags: [zones]
      operationId: classifyPoint
      summary: Devuelve la zona que contiene una coordenada (ADMIN u OPERATOR)
      description: Si varias zonas la contienen, devuelve la de menor área.
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Zona que contiene el punto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/zones/{id}:
    get:
      tags: [zones]
      operationId: getZone
      summary: Obtiene una zona (ADMIN u OPERATOR)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Zona
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [zones]
      operationId: updateZone
      summary: Redibuja una zona existente (solo ADMIN). Valida las mismas reglas que la creación.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateZoneRequest" }
      responses:
        "200":
          description: Zona actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [zones]
      operationId: deleteZone
      summary: Borra físicamente una zona inactiva (solo ADMIN). Requiere motivo y queda en la bitácora.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        "204": { description: Zona borrada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/zones/{id}/status:
    patch:
      tags: [zones]
      operationId: setZoneStatus
      summary: Activa o desactiva una zona (solo ADMIN). El motivo es obligatorio y queda en la bitácora.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        "200":
          description: Zona actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Lista el catálogo. CUSTOMER ve solo los productos activos
      description: |
        Para ADMIN y OPERATOR, includeInactive=true incluye también los productos retirados.
        Pedir includeInactive como CUSTOMER responde 403.
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Productos
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products: { type: array, items: { $ref: "#/components/schemas/Product" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [products]
      operationId: createProduct
      summary: Crea un producto (ADMIN u OPERATOR)
      description: |
        El precio es texto decimal con como máximo dos decimales, por ejemplo "2.50".
        Sin initialStock el producto no controla stock. Con initialStock, queda registrado como entrada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/products/{id}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Devuelve un producto. Para CUSTOMER, un producto inactivo es no encontrado
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Producto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/products/{id}/active:
    patch:
      tags: [products]
      operationId: setProductActive
      summary: Oferta o retira un producto (ADMIN u OPERATOR). No cambia pedidos anteriores
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetProductActiveRequest" }
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/products/{id}/stock-adjustments:
    post:
      tags: [products]
      operationId: adjustProductStock
      summary: Registra una entrada (RESTOCK) o un ajuste manual con motivo (ADJUSTMENT)
      description: |
        Un ajuste puede sumar o restar, pero no puede dejar el stock en negativo (422).
        Las ventas y devoluciones las registra el servicio al pedir o cancelar; no se envían aquí.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustStockRequest" }
      responses:
        "201":
          description: Movimiento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/products/{id}/stock-movements:
    get:
      tags: [products]
      operationId: listProductStockMovements
      summary: Historial de stock de un producto, del más reciente al más antiguo (ADMIN u OPERATOR)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Movimientos
          content:
            application/json:
              schema:
                type: object
                required: [movements]
                properties:
                  movements: { type: array, items: { $ref: "#/components/schemas/StockMovement" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/drivers/me/route:
    get:
      tags: [drivers]
      operationId: getMyDriverRoute
      summary: Ruta asignada al repartidor autenticado (solo DRIVER)
      description: |
        NO IMPLEMENTADO. Responde 501 hasta que exista el Routing Service, que es quien posee la
        ruta. Ninguna respuesta 200 contiene datos inventados. La app móvil trata 501 como
        "servicio no disponible".
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /api/v1/drivers/me/routes/{routeId}/stops/{stopId}/status:
    patch:
      tags: [drivers]
      operationId: setMyStopStatus
      summary: Avanza una parada a PICKED_UP o IN_TRANSIT (solo DRIVER)
      description: |
        NO IMPLEMENTADO. Responde 501 hasta que exista el Tracking Service, que posee las
        transiciones de parada. El resultado final de la parada va en el endpoint de resultado.
      parameters:
        - name: routeId
          in: path
          required: true
          schema: { type: string }
        - name: stopId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PICKED_UP, IN_TRANSIT] }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /api/v1/drivers/me/routes/{routeId}/stops/{stopId}/result:
    post:
      tags: [drivers]
      operationId: registerMyStopResult
      summary: Registra el resultado de una parada (solo DRIVER)
      description: |
        NO IMPLEMENTADO. Responde 501 porque la dirección y la ventana de la parada las aporta el
        Routing Service, que aún no existe. El cliente nunca envía la ubicación de la parada: el
        sistema comprueba la llegada (ADR 0007, sección 5). Cuando exista la fuente, el cuerpo
        será el de este contrato.
      parameters:
        - name: routeId
          in: path
          required: true
          schema: { type: string }
        - name: stopId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, location]
              properties:
                outcome: { type: string, enum: [DELIVERED, NOT_DELIVERED] }
                reason:
                  type: string
                  description: Obligatorio con NOT_DELIVERED y ausente con DELIVERED
                  enum: [CLIENT_REFUSED, CLIENT_ABSENT, OUT_OF_WINDOW, PRODUCT_DAMAGED, WRONG_ADDRESS, DUPLICATE_ORDER]
                location:
                  type: object
                  required: [latitude, longitude]
                  description: Posición GPS del repartidor al registrar (ADR 0007, sección 4)
                  properties:
                    latitude: { type: number, minimum: -90, maximum: 90 }
                    longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    Role:
      type: string
      enum: [ADMIN, OPERATOR, DRIVER]
    User:
      type: object
      required: [id, email, fullName, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CustomerStatus:
      type: string
      enum: [ACTIVO, BLOQUEADO_POR_SALDO, BLOQUEADO_POR_INCIDENCIAS]
    Customer:
      type: object
      required: [id, userId, fullName, email, status, pendingSurcharge, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        status: { $ref: "#/components/schemas/CustomerStatus" }
        pendingSurcharge: { type: string, example: "0.00", description: "Decimal con 2 decimales, como string" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerList:
      type: object
      required: [customers, total, limit, offset]
      properties:
        customers:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        total: { type: integer, description: "Total que cumple el filtro, independiente de limit/offset" }
        limit: { type: integer, description: Valor solicitado (0 = default del servicio) }
        offset: { type: integer }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: Segundos hasta que expira el token, example: 3600 }
        user: { $ref: "#/components/schemas/User" }
    CreateUserRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        fullName: { type: string, maxLength: 120 }
        role: { $ref: "#/components/schemas/Role" }
    UpdateUserRequest:
      type: object
      description: Campos opcionales; ausente significa no cambiar.
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        role: { type: string, enum: [ADMIN, OPERATOR, DRIVER] }
    OrderStatus:
      type: string
      enum: [PENDING, PENDING_REVIEW, ROUTE_ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED, NOT_DELIVERED, CANCELLED]
    ReviewReason:
      type: string
      description: Regla de la validación automática que no se cumplió (ADR 0007, sección 3).
      enum: [ZONE_NOT_COVERED, INVALID_WINDOW, CAPACITY_EXCEEDED, CUSTOMER_BLOCKED, ADDRESS_NOT_LOCATED]
    OrderReviewAction:
      type: string
      enum: [CONFIRM, CORRECT, REJECT]
    Order:
      type: object
      required: [id, address, latitude, longitude, deliveryDate, windowStart, windowEnd, status, reviewReasons, createdAt]
      properties:
        id: { type: string, format: uuid }
        address: { type: string, minLength: 5, maxLength: 300 }
        latitude: { type: number, minimum: -90, maximum: 90, description: Latitud WGS 84 del punto de entrega }
        longitude: { type: number, minimum: -180, maximum: 180, description: Longitud WGS 84 del punto de entrega }
        deliveryDate: { type: string, format: date, description: Fecha civil de entrega YYYY-MM-DD en la zona horaria de operación; independiente de createdAt }
        windowStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: Hora de inicio HH:mm }
        windowEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: Hora de fin HH:mm }
        status: { $ref: "#/components/schemas/OrderStatus" }
        reviewReasons:
          type: array
          description: Motivos por los que el pedido quedó en revisión. Vacío si no aplica.
          items: { $ref: "#/components/schemas/ReviewReason" }
        createdAt: { type: string, format: date-time, description: Instante de registro asignado por el servidor en RFC 3339 UTC }
    CreateOrderRequest:
      type: object
      required: [address, deliveryDate, windowStart, windowEnd, items]
      properties:
        address: { type: string, minLength: 5, maxLength: 300, description: "Dirección escrita por el cliente. El backend la localiza y valida la zona" }
        latitude: { type: number, minimum: -90, maximum: 90, description: "Opcional. Punto WGS 84 elegido en el mapa; si falta, el backend geocodifica la dirección" }
        longitude: { type: number, minimum: -180, maximum: 180, description: "Opcional. Punto WGS 84 elegido en el mapa; debe enviarse junto con latitude" }
        deliveryDate: { type: string, format: date }
        windowStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        windowEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: Debe ser posterior a windowStart }
        items:
          type: array
          minItems: 1
          description: "Productos del pedido (ADR 0009). Al menos uno, sin repetir producto. El precio lo fija el servidor."
          items: { $ref: "#/components/schemas/OrderItemRequest" }
    OrderCorrection:
      type: object
      description: Campos que el operador puede corregir. Los omitidos conservan su valor.
      properties:
        address: { type: string, minLength: 5, maxLength: 300 }
        deliveryDate: { type: string, format: date }
        windowStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        windowEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
    Notification:
      type: object
      required: [id, orderId, kind, detail, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        kind: { type: string, enum: [ORDER_IN_REVIEW, ORDER_CONFIRMED, ORDER_CORRECTED, ORDER_REJECTED] }
        detail: { type: string, maxLength: 300, description: Motivos del aviso o motivo de auditoría del operador }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    OrderReviewRequest:
      type: object
      required: [action, reason]
      properties:
        action: { $ref: "#/components/schemas/OrderReviewAction" }
        reason: { type: string, minLength: 5, maxLength: 300, description: Motivo registrado en la auditoría }
        correction: { $ref: "#/components/schemas/OrderCorrection" }
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    Zone:
      type: object
      required: [id, code, name, ring, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        ring:
          type: array
          minItems: 5
          items: { $ref: "#/components/schemas/Coordinate" }
          description: Anillo cerrado; el primer punto coincide con el último. Son 4 vértices como mínimo, formando un polígono convexo y simple (trapecio, cuadrado o similar).
        holes:
          type: array
          description: Huecos de la zona (dona). Cada hueco es un anillo cerrado estrictamente dentro del exterior y sin tocarlo ni superponerse con otros. Vacío si no hay huecos.
          items:
            type: array
            minItems: 5
            items: { $ref: "#/components/schemas/Coordinate" }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: Una zona inactiva no clasifica puntos ni valida pedidos, pero se conserva para el historial.
        statusReason:
          type: string
          description: Motivo del último cambio de estado. Vacío si nunca se ha desactivado.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: "Sube en cada cambio. Envíala como expectedVersion al editar la zona." }
        createdBy: { type: string, description: "Usuario que creó la zona, tomado del token." }
        updatedBy: { type: string, description: "Usuario del último cambio, tomado del token." }
        settings: { $ref: "#/components/schemas/ZoneSettings" }
    ZoneSettings:
      type: object
      description: Configuración operativa de la zona. Solo ADMIN la define.
      required: [depotName, depotLatitude, depotLongitude, maxOrdersPerRoute, routeCapacityKg, serviceDays, deliveryWindowFrom, deliveryWindowTo, cutoffTime, dispatchTime, priority, dailyOrderLimit]
      properties:
        description: { type: string, maxLength: 500 }
        depotName: { type: string, maxLength: 120, description: Bodega o almacén de salida de los repartidores. Vacío en zonas anteriores a la configuración. }
        depotLatitude: { type: number, minimum: -5, maximum: 2, description: "Latitud de la bodega. Dentro de Ecuador (-5 a 2)." }
        depotLongitude: { type: number, minimum: -92, maximum: -75, description: "Longitud de la bodega. Dentro de Ecuador (-92 a -75)." }
        maxOrdersPerRoute: { type: integer, minimum: 1, maximum: 50, description: "Máximo de pedidos por ruta (1 a 50)." }
        routeCapacityKg: { type: number, minimum: 1, maximum: 1000, description: "Capacidad de carga por ruta en kilogramos (1 a 1000)." }
        timezone: { type: string, example: "America/Guayaquil", description: "Zona horaria IANA. Por defecto America/Guayaquil." }
        serviceDays:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] }
        deliveryWindowFrom: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Inicio de la ventana de entrega, HH:MM local." }
        deliveryWindowTo: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Fin de la ventana de entrega, HH:MM local. Debe ser posterior al inicio." }
        cutoffTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Hora de corte para pedidos de la fecha, HH:MM local." }
        dispatchTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Hora en que salen las rutas, HH:MM local." }
        priority: { type: string, enum: [NORMAL, HIGH, LOW] }
        dailyOrderLimit: { type: integer, minimum: 1, maximum: 10000, description: "Límite de pedidos por fecha de entrega (1 a 10000)." }
    CreateZoneRequest:
      type: object
      required: [name, ring]
      properties:
        code: { type: string, maxLength: 32, description: "Opcional. Si se omite, el servidor genera el código a partir del nombre (NORTE-001)." }
        name: { type: string, maxLength: 120 }
        ring:
          type: array
          minItems: 5
          items: { $ref: "#/components/schemas/Coordinate" }
          description: Anillo cerrado con al menos 4 vértices. Debe ser un polígono convexo y simple; el servicio responde INVALID_ARGUMENT si no lo es.
        holes:
          type: array
          description: Huecos opcionales (dona). Cada uno debe quedar estrictamente dentro del anillo exterior y no superponerse con otro hueco; si no, INVALID_ARGUMENT.
          items:
            type: array
            minItems: 5
            items: { $ref: "#/components/schemas/Coordinate" }
        settings: { $ref: "#/components/schemas/ZoneSettings" }
    UpdateZoneRequest:
      allOf:
        - $ref: "#/components/schemas/CreateZoneRequest"
        - type: object
          properties:
            expectedVersion: { type: integer, minimum: 0, description: "Versión que viste por última vez. 0 o ausente = sin control. Si no coincide, responde CONFLICT (409)." }
    Product:
      type: object
      required: [id, name, unitPrice, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        unitPrice: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$", description: "Precio unitario en USD con como máximo dos decimales, como texto para no perder centavos" }
        active: { type: boolean, description: "Falso: no se ofrece al cliente; los pedidos anteriores no cambian" }
        stockQuantity: { type: integer, format: int64, minimum: 0, description: "Ausente cuando el producto no controla stock" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateProductRequest:
      type: object
      required: [name, unitPrice]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        unitPrice: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        initialStock: { type: integer, format: int64, minimum: 0, description: "Opcional. Ausente: el producto no controla stock" }
    SetProductActiveRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    AdjustStockRequest:
      type: object
      required: [type, delta]
      properties:
        type: { type: string, enum: [RESTOCK, ADJUSTMENT] }
        delta: { type: integer, format: int64, description: "RESTOCK exige positivo. ADJUSTMENT admite positivo o negativo, distinto de cero" }
        reason: { type: string, maxLength: 300, description: "Obligatorio para ADJUSTMENT" }
    StockMovement:
      type: object
      required: [id, productId, type, delta, resultingStock, createdAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        type: { type: string, enum: [RESTOCK, ADJUSTMENT, SALE, RETURN] }
        delta: { type: integer, format: int64 }
        resultingStock: { type: integer, format: int64, minimum: 0 }
        reason: { type: string }
        orderId: { type: string, format: uuid, description: "Solo en movimientos SALE y RETURN" }
        createdAt: { type: string, format: date-time }
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1, maximum: 50 }
    OrderLine:
      type: object
      required: [productId, name, unitPrice, quantity]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        unitPrice: { type: string, description: "Precio del momento del pedido, con dos decimales" }
        quantity: { type: integer, format: int64, minimum: 1, maximum: 50 }
    CreatedOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [items, total]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderLine" }
            total: { type: string, description: "Suma de los subtotales, con dos decimales" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INVALID_ARGUMENT
              description: |
                INVALID_ARGUMENT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT,
                FAILED_PRECONDITION, RATE_LIMITED, PAYLOAD_TOO_LARGE,
                UNSUPPORTED_MEDIA_TYPE, UPSTREAM_TIMEOUT, UPSTREAM_UNAVAILABLE, NOT_IMPLEMENTED, INTERNAL
            message: { type: string }
            requestId: { type: string, description: Igual a la cabecera X-Request-Id }
  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token ausente, inválido o expirado, o credenciales incorrectas
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Sin permiso sobre el recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotImplemented:
      description: Ruta reservada, sin backend todavía. Código NOT_IMPLEMENTED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
