openapi: 3.0.3
info:
  title: Pikka API
  version: 1.0.0
  description: |
    API pública REST/JSON expuesta por el API Gateway. Clientes: aplicación web
    (React) y aplicación móvil de repartidores (React Native). Los microservicios
    internos no son accesibles directamente.

    Fase 1 cubre autenticación y usuarios. Pedidos, zonas, rutas, repartidores y
    seguimiento se agregan en las fases siguientes.
servers:
  - url: /
    description: Este API Gateway
tags:
  - name: health
    description: Liveness y readiness del Gateway
  - name: auth
    description: Inicio de sesión e identidad actual
  - name: users
    description: Administración de usuarios y roles
  - name: orders
    description: Registro y consulta de pedidos
  - name: zones
    description: Zonas de reparto y clasificación de coordenadas
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: El proceso está vivo
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /ready:
    get:
      tags: [health]
      operationId: getReady
      summary: El Gateway y sus dependencias pueden recibir tráfico
      security: []
      responses:
        "200":
          description: Listo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Alguna dependencia no está lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y obtiene un token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Devuelve el usuario autenticado
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users:
    post:
      tags: [users]
      operationId: createUser
      summary: Crea un usuario (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Obtiene un usuario (ADMIN, OPERATOR o el propio usuario)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Lista pedidos (ADMIN u OPERATOR)
      description: DRIVER no tiene acceso. El filtrado por alcance se define con el rol CUSTOMER.
      responses:
        "200":
          description: Pedidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [orders]
      operationId: createOrder
      summary: Registra un pedido (ADMIN u OPERATOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Pedido registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orders/exceptions:
    get:
      tags: [orders]
      operationId: listOrderExceptions
      summary: Cola de excepciones de pedidos pendientes de revisión (ADMIN u OPERATOR)
      description: Pedidos cuya validación automática no se cumplió (ADR 0007, sección 3). El operador los confirma, corrige o rechaza.
      responses:
        "200":
          description: Pedidos en revisión
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orders/{id}/review:
    post:
      tags: [orders]
      operationId: reviewOrder
      summary: Confirma, corrige o rechaza un pedido en revisión (ADMIN u OPERATOR)
      description: Solo aplica a pedidos en estado PENDING_REVIEW. Toda decisión queda registrada con motivo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderReviewRequest" }
      responses:
        "200":
          description: Pedido actualizado según la decisión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/zones:
    get:
      tags: [zones]
      operationId: listZones
      summary: Lista todas las zonas (ADMIN u OPERATOR)
      responses:
        "200":
          description: Zonas registradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [zones]
      operationId: createZone
      summary: Registra una zona (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateZoneRequest" }
      responses:
        "201":
          description: Zona creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/zones/classify:
    get:
      tags: [zones]
      operationId: classifyPoint
      summary: Devuelve la zona que contiene una coordenada (ADMIN u OPERATOR)
      description: Si varias zonas la contienen, devuelve la de menor área.
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Zona que contiene el punto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/zones/{id}:
    get:
      tags: [zones]
      operationId: getZone
      summary: Obtiene una zona (ADMIN u OPERATOR)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Zona
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [zones]
      operationId: updateZone
      summary: Redibuja una zona existente (solo ADMIN). Valida las mismas reglas que la creación.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateZoneRequest" }
      responses:
        "200":
          description: Zona actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [zones]
      operationId: deleteZone
      summary: Borra físicamente una zona inactiva (solo ADMIN). Requiere motivo y queda en la bitácora.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        "204": { description: Zona borrada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/zones/{id}/status:
    patch:
      tags: [zones]
      operationId: setZoneStatus
      summary: Activa o desactiva una zona (solo ADMIN). El motivo es obligatorio y queda en la bitácora.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        "200":
          description: Zona actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    Role:
      type: string
      enum: [ADMIN, OPERATOR, DRIVER]
    User:
      type: object
      required: [id, email, fullName, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: Segundos hasta que expira el token, example: 3600 }
        user: { $ref: "#/components/schemas/User" }
    CreateUserRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        fullName: { type: string, maxLength: 120 }
        role: { $ref: "#/components/schemas/Role" }
    OrderStatus:
      type: string
      enum: [PENDING, PENDING_REVIEW, ROUTE_ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED, NOT_DELIVERED, CANCELLED]
    ReviewReason:
      type: string
      description: Regla de la validación automática que no se cumplió (ADR 0007, sección 3).
      enum: [ZONE_NOT_COVERED, INVALID_WINDOW, CAPACITY_EXCEEDED, CUSTOMER_BLOCKED]
    OrderReviewAction:
      type: string
      enum: [CONFIRM, CORRECT, REJECT]
    Order:
      type: object
      required: [id, address, latitude, longitude, deliveryDate, windowStart, windowEnd, status, reviewReasons, createdAt]
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90, description: Latitud WGS 84 del punto de entrega }
        longitude: { type: number, minimum: -180, maximum: 180, description: Longitud WGS 84 del punto de entrega }
        deliveryDate: { type: string, format: date, description: Fecha de entrega YYYY-MM-DD }
        windowStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: Hora de inicio HH:mm }
        windowEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: Hora de fin HH:mm }
        status: { $ref: "#/components/schemas/OrderStatus" }
        reviewReasons:
          type: array
          description: Motivos por los que el pedido quedó en revisión. Vacío si no aplica.
          items: { $ref: "#/components/schemas/ReviewReason" }
        createdAt: { type: string, format: date-time }
    CreateOrderRequest:
      type: object
      required: [address, latitude, longitude, deliveryDate, windowStart, windowEnd]
      properties:
        address: { type: string, minLength: 5, maxLength: 300 }
        latitude: { type: number, minimum: -90, maximum: 90, description: Latitud WGS 84 elegida en el mapa }
        longitude: { type: number, minimum: -180, maximum: 180, description: Longitud WGS 84 elegida en el mapa }
        deliveryDate: { type: string, format: date }
        windowStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        windowEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: Debe ser posterior a windowStart }
    OrderCorrection:
      type: object
      description: Campos que el operador puede corregir. Los omitidos conservan su valor.
      properties:
        address: { type: string, minLength: 5, maxLength: 300 }
        deliveryDate: { type: string, format: date }
        windowStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        windowEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
    OrderReviewRequest:
      type: object
      required: [action, reason]
      properties:
        action: { $ref: "#/components/schemas/OrderReviewAction" }
        reason: { type: string, minLength: 5, maxLength: 300, description: Motivo registrado en la auditoría }
        correction: { $ref: "#/components/schemas/OrderCorrection" }
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    Zone:
      type: object
      required: [id, code, name, ring, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        ring:
          type: array
          minItems: 5
          items: { $ref: "#/components/schemas/Coordinate" }
          description: Anillo cerrado; el primer punto coincide con el último. Son 4 vértices como mínimo, formando un polígono convexo y simple (trapecio, cuadrado o similar).
        holes:
          type: array
          description: Huecos de la zona (dona). Cada hueco es un anillo cerrado estrictamente dentro del exterior y sin tocarlo ni superponerse con otros. Vacío si no hay huecos.
          items:
            type: array
            minItems: 5
            items: { $ref: "#/components/schemas/Coordinate" }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: Una zona inactiva no clasifica puntos ni valida pedidos, pero se conserva para el historial.
        statusReason:
          type: string
          description: Motivo del último cambio de estado. Vacío si nunca se ha desactivado.
        createdAt: { type: string, format: date-time }
    CreateZoneRequest:
      type: object
      required: [name, ring]
      properties:
        code: { type: string, maxLength: 32, description: Opcional. Si se omite, el servidor genera el código a partir del nombre (NORTE-001). }
        name: { type: string, maxLength: 120 }
        ring:
          type: array
          minItems: 5
          items: { $ref: "#/components/schemas/Coordinate" }
          description: Anillo cerrado con al menos 4 vértices. Debe ser un polígono convexo y simple; el servicio responde INVALID_ARGUMENT si no lo es.
        holes:
          type: array
          description: Huecos opcionales (dona). Cada uno debe quedar estrictamente dentro del anillo exterior y no superponerse con otro hueco; si no, INVALID_ARGUMENT.
          items:
            type: array
            minItems: 5
            items: { $ref: "#/components/schemas/Coordinate" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INVALID_ARGUMENT
              description: |
                INVALID_ARGUMENT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT,
                FAILED_PRECONDITION, RATE_LIMITED, PAYLOAD_TOO_LARGE,
                UNSUPPORTED_MEDIA_TYPE, UPSTREAM_TIMEOUT, UPSTREAM_UNAVAILABLE, INTERNAL
            message: { type: string }
            requestId: { type: string, description: Igual a la cabecera X-Request-Id }
  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token ausente, inválido o expirado, o credenciales incorrectas
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Sin permiso sobre el recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicto con el estado actual
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: La operación no se puede hacer en el estado actual de la zona
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Límite de peticiones excedido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
