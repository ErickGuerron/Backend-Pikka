  /api/v1/routes/plan:
    post:
      tags: [routes]
      operationId: generateRoutePlan
      summary: Generate the route plan for a delivery date (ADMIN or OPERATOR)
      description: |
        Plans the PENDING orders of the date, reserves one driver per route and assigns each route's orders.
        Routes are processed in order and the run is not atomic: routes created before a failure stay
        assigned, and the error message says how many. The orders of the failing route are not changed.
        The Routing Service validates the role and the date; other roles get 403 before any work is done.
        Failures in Order, Zone or Driver Service come back as 500 with code INTERNAL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneratePlanRequest" }
      responses:
        "200":
          description: Plan generated. routes is empty when the date has no pending orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneratePlanResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415":
          description: Content-Type is not application/json. Code UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: No driver is available for a route, or Driver Service rejected a reservation. Code FAILED_PRECONDITION
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Routing Service unavailable. Code UPSTREAM_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/drivers:
    get:
      tags: [drivers]
      operationId: listDrivers
      summary: Lista la flota de repartidores (ADMIN y OPERATOR)
      description: |
        Devuelve todos los repartidores, activos e inactivos y en cualquier estado, ordenados por
        apellido y nombre, hasta un m├íximo de 500. No incluye fecha de nacimiento ni documento de
        identidad. Sin repartidores devuelve un arreglo vac├¡o.
      responses:
        "200":
          description: Flota de repartidores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Driver Service no disponible. C├│digo UPSTREAM_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [drivers]
      operationId: createDriver
      summary: Da de alta un repartidor (solo ADMIN)
      description: |
        Crea el usuario con rol DRIVER en Auth Service y su perfil en Driver Service. Son dos
        servicios con base de datos propia, sin transacci├│n com├║n: si el perfil falla (datos
        inv├ílidos, identificador o placa repetidos), el Gateway desactiva el usuario reci├⌐n creado
        y responde con el error del perfil. Auth Service no borra usuarios, as├¡ que el correo de un
        alta fallida queda reservado y hay que usar otro. Las formas inv├ílidas de `birthDate` y
        `vehicleType` se rechazan con 400 antes de crear nada. El repartidor nace activo y AVAILABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDriverRequest" }
      responses:
        "201":
          description: Repartidor creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateDriverResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Correo, identificador o placa ya registrados. C├│digo CONFLICT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Auth Service o Driver Service no disponible. C├│digo UPSTREAM_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/drivers/me/route:
    get:
      tags: [drivers]
      operationId: getMyDriverRoute
      summary: Ruta asignada al repartidor autenticado (solo DRIVER)
      description: |
        NO IMPLEMENTADO. Responde 501 hasta que exista el Routing Service, que es quien posee la
        ruta. Ninguna respuesta 200 contiene datos inventados. La app móvil trata 501 como
        "servicio no disponible".
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /api/v1/drivers/me/routes/{routeId}/stops/{stopId}/status:
    patch:
      tags: [drivers]
      operationId: setMyStopStatus
      summary: Advances a stop of the authenticated driver's route to PICKED_UP or IN_TRANSIT (DRIVER only)
      description: |
        The route must be reserved for the authenticated driver. A route that belongs to another driver, a route
        that does not exist and a route with no driver all respond 404 with the same message.
        The `stopId` is the order id of the stop. Order Service validates the step against the order's current
        status: an illegal step responds 422 (FAILED_PRECONDITION).
        DELIVERED and NOT_DELIVERED are not accepted here (400); the final result of a stop goes through the result endpoint.
      parameters:
        - name: routeId
          in: path
          required: true
          schema: { type: string }
        - name: stopId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PICKED_UP, IN_TRANSIT] }
      responses:
        "200":
          description: Stop advanced. Returns the new order status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StopStatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: Content-Type is not application/json. Code UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The step is not allowed from the order's current status. Code FAILED_PRECONDITION
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Order Service or Driver Service unavailable. Code UPSTREAM_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/drivers/me/routes/{routeId}/stops/{stopId}/result:
    post:
      tags: [drivers]
      operationId: registerMyStopResult
      summary: Registra el resultado de una parada (solo DRIVER)
      description: |
        NO IMPLEMENTADO. Responde 501 porque la dirección y la ventana de la parada las aporta el
        Routing Service, que aún no existe. El cliente nunca envía la ubicación de la parada: el
        sistema comprueba la llegada (ADR 0007, sección 5). Cuando exista la fuente, el cuerpo
        será el de este contrato.
      parameters:
        - name: routeId
          in: path
          required: true
          schema: { type: string }
        - name: stopId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, location]
              properties:
                outcome: { type: string, enum: [DELIVERED, NOT_DELIVERED] }
                reason:
                  type: string
                  description: Obligatorio con NOT_DELIVERED y ausente con DELIVERED
                  enum: [CLIENT_REFUSED, CLIENT_ABSENT, OUT_OF_WINDOW, PRODUCT_DAMAGED, WRONG_ADDRESS, DUPLICATE_ORDER]
                location:
                  type: object
                  required: [latitude, longitude]
                  description: Posición GPS del repartidor al registrar (ADR 0007, sección 4)
                  properties:
                    latitude: { type: number, minimum: -90, maximum: 90 }
                    longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }
  /api/v1/drivers/me/location:
    put:
      tags: [drivers]
      operationId: reportMyLocation
      summary: Reporta la posición GPS del repartidor autenticado (solo DRIVER)
      description: |
        Guarda la última posición del repartidor en el Tracking Service. Un reporte más antiguo que el
        guardado se descarta en silencio y también responde 204. La posición no se devuelve a ningún
        cliente ni se registra en logs. Cualquier repartidor con token válido puede reportar; la
        verificación de ruta activa llega con el Routing Service.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverLocationRequest" }
      responses:
        "204": { description: Posición recibida. Sin cuerpo }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Tracking Service no disponible. Código UPSTREAM_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    Role:
      type: string
      enum: [ADMIN, OPERATOR, DRIVER]
    User:
      type: object
      required: [id, email, fullName, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CustomerStatus:
      type: string
      enum: [ACTIVO, BLOQUEADO_POR_SALDO, BLOQUEADO_POR_INCIDENCIAS]
    Customer:
      type: object
      required: [id, userId, fullName, email, status, pendingSurcharge, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: Teléfono normalizado. Vacío u omitido en clientes anteriores a este dato }
        city: { type: string, description: Ciudad del cliente. Vacío u omitido en clientes anteriores a este dato }
        status: { $ref: "#/components/schemas/CustomerStatus" }
        pendingSurcharge: { type: string, example: "0.00", description: "Decimal con 2 decimales, como string" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        recidivistAt: { type: string, format: date-time, description: "Cuando se marco al cliente como reincidente (tres no entregas suyas en 14 dias, ADR 0006). Ausente si no lo es" }
    CustomerList:
      type: object
      required: [customers, total, limit, offset]
      properties:
        customers:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        total: { type: integer, description: "Total que cumple el filtro, independiente de limit/offset" }
        limit: { type: integer, description: Valor solicitado (0 = default del servicio) }
        offset: { type: integer }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: "Segundos hasta que expira el token", example: 3600 }
        user: { $ref: "#/components/schemas/User" }
    CreateUserRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
        fullName: { type: string, maxLength: 120 }
        role: { $ref: "#/components/schemas/Role" }
    UpdateUserRequest:
      type: object
      description: Campos opcionales; ausente significa no cambiar.
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        role: { type: string, enum: [ADMIN, OPERATOR, DRIVER] }
    OrderStatus:
      type: string
      enum: [PENDING, PENDING_REVIEW, ROUTE_ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED, NOT_DELIVERED, CANCELLED]
    ReviewReason:
      type: string
      description: Regla de la validación automática que no se cumplió (ADR 0007, sección 3).
      enum: [ZONE_NOT_COVERED, INVALID_WINDOW, CAPACITY_EXCEEDED, CUSTOMER_BLOCKED, ADDRESS_NOT_LOCATED]
    OrderReviewAction:
      type: string
      enum: [CONFIRM, CORRECT, REJECT]
    RecidivismChargeRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: string, example: "12.50", description: "Decimal mayor que cero, como string. Se redondea a centavos" }
        reason: { type: string, minLength: 5, maxLength: 300, description: "Justificacion de la decision, se guarda como auditoria" }
    Recidivist:
      type: object
      required: [customerId, fullName, contactPhone, recidivistAt, pendingSurcharge, chargeApplied]
      properties:
        customerId: { type: string, format: uuid }
        fullName: { type: string, description: "Nombre del cliente, quien recibe las entregas" }
        contactPhone: { type: string, description: Telefono del ultimo pedido o del cliente. Vacio si no hay ninguno. }
        recidivistAt: { type: string, format: date-time, description: Cuando se marco al cliente }
        pendingSurcharge: { type: string, example: "4.50", description: Saldo pendiente actual como decimal con dos digitos }
        chargeApplied: { type: boolean, description: true si el recargo extra de esta marca ya se aplico }
    ClearRecidivistRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 300, description: "Justificación del administrador, auditada" }
    RecidivistClear:
      type: object
      required: [id, customerId, recidivistAt, reason, clearedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        recidivistAt: { type: string, format: date-time, description: Marca que se quitó }
        reason: { type: string }
        clearedBy: { type: string, format: uuid, description: Administrador que la quitó }
        createdAt: { type: string, format: date-time }
    RecidivismCharge:
      type: object
      required: [id, customerId, recidivistAt, amount, reason, appliedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        recidivistAt: { type: string, format: date-time, description: Marca de reincidencia a la que responde este recargo }
        amount: { type: string, example: "12.50" }
        reason: { type: string }
        appliedBy: { type: string, format: uuid, description: Operador que lo aplico }
        createdAt: { type: string, format: date-time }
    BalanceLine:
      type: object
      required: [kind, id, reason, amount, startedAt, dueAt]
      properties:
        kind: { type: string, enum: [SURCHARGE, RECIDIVISM] }
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid, description: Pedido que no se entrego. Ausente en RECIDIVISM }
        reason: { type: string, description: "Codigo que la app puede traducir, por ejemplo CLIENT_REFUSED. RECIDIVISM para el recargo extra" }
        amount: { type: string, example: "3.00" }
        startedAt: { type: string, format: date-time, description: Cuando empezo el plazo de 2 semanas }
        dueAt: { type: string, format: date-time, description: Ultimo momento para pagar antes del bloqueo }
    MyBalance:
      type: object
      required: [pendingSurcharge, accountStatus, blocked, simulated, lines]
      properties:
        pendingSurcharge: { type: string, example: "7.50", description: Total que debe }
        accountStatus: { $ref: "#/components/schemas/CustomerStatus" }
        blocked: { type: boolean, description: true mientras la cuenta esta BLOQUEADO_POR_SALDO }
        simulated: { type: boolean, description: Siempre true. Los pagos son simulados }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BalanceLine" }
    BalancePayment:
      type: object
      required: [status, simulated, amount, reference, unblocked, createdAt]
      properties:
        status: { type: string, enum: [SIMULATED_APPROVED, SIMULATED_DECLINED] }
        simulated: { type: boolean, description: Siempre true. El cobro nunca es real en el MVP }
        amount: { type: string, example: "7.50", description: Saldo que se cobro }
        reference: { type: string, description: Referencia interna del intento de cobro }
        unblocked: { type: boolean, description: true si este pago devolvio la cuenta de BLOQUEADO_POR_SALDO a ACTIVO }
        createdAt: { type: string, format: date-time }
    Surcharge:
      type: object
      required: [id, customerId, orderId, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        orderId: { type: string, format: uuid, description: Pedido que no se entrego. Hay un recargo por pedido. }
        reason: { type: string, description: "Motivo cerrado de la no entrega, por ejemplo WRONG_ADDRESS" }
        status: { type: string, enum: [PENDING, PENDING_VERIFICATION, APPLIED, PAID, WAIVED] }
        amount: { type: string, description: Decimal con dos digitos. Ausente hasta que exista el siguiente pedido sobre el que se calcula el 15 %. }
        createdAt: { type: string, format: date-time }
        resolvedBy: { type: string, format: uuid, description: Operador que decidio la verificacion }
        resolutionReason: { type: string }
        resolvedAt: { type: string, format: date-time }
    SurchargeVerificationRequest:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [CONFIRM, WAIVE] }
        reason: { type: string, minLength: 5, maxLength: 300, description: "Motivo de la decision, se guarda como auditoria" }
    Order:
      type: object
      required: [id, address, latitude, longitude, deliveryDate, windowStart, windowEnd, status, reviewReasons, createdAt]
      properties:
        id: { type: string, format: uuid }
        address: { type: string, minLength: 5, maxLength: 300 }
        latitude: { type: number, minimum: -90, maximum: 90, description: Latitud WGS 84 del punto de entrega }
        longitude: { type: number, minimum: -180, maximum: 180, description: Longitud WGS 84 del punto de entrega }
        deliveryDate: { type: string, format: date, description: Fecha civil de entrega YYYY-MM-DD en la zona horaria de operación; independiente de createdAt }
        windowStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: Hora de inicio HH:mm }
        windowEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: Hora de fin HH:mm }
        status: { $ref: "#/components/schemas/OrderStatus" }
        reviewReasons:
          type: array
          description: Motivos por los que el pedido quedó en revisión. Vacío si no aplica.
          items: { $ref: "#/components/schemas/ReviewReason" }
        queuePosition: { type: integer, minimum: 0, description: Lugar en la cola de espera de la zona (1 es el siguiente). 0 cuando el pedido no espera. Solo lo calculan los endpoints de pedidos del cliente }
        createdAt: { type: string, format: date-time, description: Instante de registro asignado por el servidor en RFC 3339 UTC }
        addressReference: { type: string, minLength: 3, maxLength: 200, description: Referencia para ubicar el punto de entrega. Omitida en pedidos anteriores a este dato }
        postalCode: { type: string, minLength: 4, maxLength: 10, description: Código postal si el cliente lo indicó }
        contactPhone: { type: string, description: "Teléfono de contacto de la entrega, normalizado. Omitido en pedidos anteriores a este dato" }
    CreateOrderRequest:
      type: object
      required: [address, deliveryDate, windowStart, windowEnd, addressReference, contactPhone, items]
      properties:
        address: { type: string, minLength: 5, maxLength: 300, description: "Dirección escrita por el cliente. El backend la localiza y valida la zona" }
        latitude: { type: number, minimum: -90, maximum: 90, description: "Opcional. Punto WGS 84 elegido en el mapa; si falta, el backend geocodifica la dirección" }
        longitude: { type: number, minimum: -180, maximum: 180, description: "Opcional. Punto WGS 84 elegido en el mapa; debe enviarse junto con latitude" }
        deliveryDate: { type: string, format: date }
        windowStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        windowEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: Debe ser posterior a windowStart }
        addressReference: { type: string, minLength: 3, maxLength: 200, description: Referencia para ubicar el punto de entrega (se recorta antes de validar) }
        postalCode: { type: string, minLength: 4, maxLength: 10, pattern: "^[A-Za-z0-9-]+$", description: "Opcional. Letras, dígitos o guion" }
        contactPhone: { type: string, example: "0991234567", description: "Teléfono de contacto de la entrega. Mismas reglas que phone en el registro: 7 a 15 dígitos con + inicial opcional tras quitar espacios, guiones, puntos y paréntesis" }
        items:
          type: array
          minItems: 1
          description: "Productos del pedido (ADR 0009). Al menos uno, sin repetir producto. El precio lo fija el servidor."
          items: { $ref: "#/components/schemas/OrderItemRequest" }
    OrderCorrection:
      type: object
      description: Campos que el operador puede corregir. Los omitidos conservan su valor.
      properties:
        address: { type: string, minLength: 5, maxLength: 300 }
        deliveryDate: { type: string, format: date }
        windowStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        windowEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
    Notification:
      type: object
      required: [id, orderId, kind, detail, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, description: "Pedido al que se refiere el aviso. Vacío en ACCOUNT_BLOCKED_BY_BALANCE: ese aviso es de la cuenta, no de un pedido" }
        kind: { type: string, enum: [ORDER_IN_REVIEW, ORDER_CONFIRMED, ORDER_CORRECTED, ORDER_REJECTED, SURCHARGE_APPLIED, ACCOUNT_BLOCKED_BY_BALANCE] }
        detail: { type: string, maxLength: 300, description: "Motivos del aviso (ORDER_IN_REVIEW), motivo de auditoría del operador (ORDER_CONFIRMED, ORDER_CORRECTED y ORDER_REJECTED), MOTIVO,MONTO,FECHA_LIMITE en SURCHARGE_APPLIED (código cerrado, decimal con dos dígitos y fecha RFC 3339) o vacío en ACCOUNT_BLOCKED_BY_BALANCE" }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    OrderReviewRequest:
      type: object
      required: [action, reason]
      properties:
        action: { $ref: "#/components/schemas/OrderReviewAction" }
        reason: { type: string, minLength: 5, maxLength: 300, description: Motivo registrado en la auditoría }
        correction: { $ref: "#/components/schemas/OrderCorrection" }
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    CoverageZone:
      type: object
      description: Contorno de una zona activa. No lleva estado, versión ni configuración operativa.
      required: [id, code, name, ring, holes]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        ring:
          type: array
          minItems: 5
          items: { $ref: "#/components/schemas/Coordinate" }
          description: Anillo cerrado; el primer punto coincide con el último.
        holes:
          type: array
          description: Huecos de la zona (dona), cada uno un anillo cerrado. Vacío si no hay huecos.
          items:
            type: array
            minItems: 5
            items: { $ref: "#/components/schemas/Coordinate" }
    Zone:
      type: object
      required: [id, code, name, ring, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        ring:
          type: array
          minItems: 5
          items: { $ref: "#/components/schemas/Coordinate" }
          description: Anillo cerrado; el primer punto coincide con el último. Son 4 vértices como mínimo, formando un polígono convexo y simple (trapecio, cuadrado o similar).
        holes:
          type: array
          description: Huecos de la zona (dona). Cada hueco es un anillo cerrado estrictamente dentro del exterior y sin tocarlo ni superponerse con otros. Vacío si no hay huecos.
          items:
            type: array
            minItems: 5
            items: { $ref: "#/components/schemas/Coordinate" }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: Una zona inactiva no clasifica puntos ni valida pedidos, pero se conserva para el historial.
        statusReason:
          type: string
          description: Motivo del último cambio de estado. Vacío si nunca se ha desactivado.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: "Sube en cada cambio. Envíala como expectedVersion al editar la zona." }
        createdBy: { type: string, description: "Usuario que creó la zona, tomado del token." }
        updatedBy: { type: string, description: "Usuario del último cambio, tomado del token." }
        settings: { $ref: "#/components/schemas/ZoneSettings" }
    ZoneSettings:
      type: object
      description: Configuración operativa de la zona. Solo ADMIN la define.
      required: [depotName, depotLatitude, depotLongitude, maxOrdersPerRoute, routeCapacityKg, serviceDays, deliveryWindowFrom, deliveryWindowTo, cutoffTime, dispatchTime, priority, dailyOrderLimit]
      properties:
        description: { type: string, maxLength: 500 }
        depotName: { type: string, maxLength: 120, description: Bodega o almacén de salida de los repartidores. Vacío en zonas anteriores a la configuración. }
        depotLatitude: { type: number, minimum: -5, maximum: 2, description: "Latitud de la bodega. Dentro de Ecuador (-5 a 2)." }
        depotLongitude: { type: number, minimum: -92, maximum: -75, description: "Longitud de la bodega. Dentro de Ecuador (-92 a -75)." }
        maxOrdersPerRoute: { type: integer, minimum: 1, maximum: 50, description: "Máximo de pedidos por ruta (1 a 50)." }
        routeCapacityKg: { type: number, minimum: 1, maximum: 1000, description: "Capacidad de carga por ruta en kilogramos (1 a 1000)." }
        timezone: { type: string, example: "America/Guayaquil", description: "Zona horaria IANA. Por defecto America/Guayaquil." }
        serviceDays:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] }
        deliveryWindowFrom: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Inicio de la ventana de entrega, HH:MM local." }
        deliveryWindowTo: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Fin de la ventana de entrega, HH:MM local. Debe ser posterior al inicio." }
        cutoffTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Hora de corte para pedidos de la fecha, HH:MM local." }
        dispatchTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Hora en que salen las rutas, HH:MM local." }
        priority: { type: string, enum: [NORMAL, HIGH, LOW] }
        dailyOrderLimit: { type: integer, minimum: 1, maximum: 10000, description: "Límite de pedidos por fecha de entrega (1 a 10000)." }
    CreateZoneRequest:
      type: object
      required: [name, ring]
      properties:
        code: { type: string, maxLength: 32, description: "Opcional. Si se omite, el servidor genera el código a partir del nombre (NORTE-001)." }
        name: { type: string, maxLength: 120 }
        ring:
          type: array
          minItems: 5
          items: { $ref: "#/components/schemas/Coordinate" }
          description: Anillo cerrado con al menos 4 vértices. Debe ser un polígono convexo y simple; el servicio responde INVALID_ARGUMENT si no lo es.
        holes:
          type: array
          description: Huecos opcionales (dona). Cada uno debe quedar estrictamente dentro del anillo exterior y no superponerse con otro hueco; si no, INVALID_ARGUMENT.
          items:
            type: array
            minItems: 5
            items: { $ref: "#/components/schemas/Coordinate" }
        settings: { $ref: "#/components/schemas/ZoneSettings" }
    UpdateZoneRequest:
      allOf:
        - $ref: "#/components/schemas/CreateZoneRequest"
        - type: object
          properties:
            expectedVersion: { type: integer, minimum: 0, description: "Versión que viste por última vez. 0 o ausente = sin control. Si no coincide, responde CONFLICT (409)." }
    Product:
      type: object
      required: [id, name, unitPrice, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        unitPrice: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$", description: "Precio unitario en USD con como máximo dos decimales, como texto para no perder centavos" }
        active: { type: boolean, description: "Falso: no se ofrece al cliente; los pedidos anteriores no cambian" }
        stockQuantity: { type: integer, format: int64, minimum: 0, description: "Ausente cuando el producto no controla stock" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateProductRequest:
      type: object
      required: [name, unitPrice]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        unitPrice: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        initialStock: { type: integer, format: int64, minimum: 0, description: "Opcional. Ausente: el producto no controla stock" }
    SetProductActiveRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    AdjustStockRequest:
      type: object
      required: [type, delta]
      properties:
        type: { type: string, enum: [RESTOCK, ADJUSTMENT] }
        delta: { type: integer, format: int64, description: "RESTOCK exige positivo. ADJUSTMENT admite positivo o negativo, distinto de cero" }
        reason: { type: string, maxLength: 300, description: "Obligatorio para ADJUSTMENT" }
    StockMovement:
      type: object
      required: [id, productId, type, delta, resultingStock, createdAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        type: { type: string, enum: [RESTOCK, ADJUSTMENT, SALE, RETURN] }
        delta: { type: integer, format: int64 }
        resultingStock: { type: integer, format: int64, minimum: 0 }
        reason: { type: string }
        orderId: { type: string, format: uuid, description: "Solo en movimientos SALE y RETURN" }
        createdAt: { type: string, format: date-time }
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1, maximum: 50 }
    OrderLine:
      type: object
      required: [productId, name, unitPrice, quantity]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        unitPrice: { type: string, description: "Precio del momento del pedido, con dos decimales" }
        quantity: { type: integer, format: int64, minimum: 1, maximum: 50 }
    CreatedOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [items, total, pendingSurcharge]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderLine" }
            total: { type: string, description: "Suma de los subtotales, con dos decimales" }
            pendingSurcharge: { type: string, example: "7.50", description: "Lo que el cliente debe al confirmar el pedido, como linea aparte; no esta incluido en total (ADR 0006, seccion 4). 0.00 si no debe nada" }
    DriverLocationRequest:
      type: object
      required: [latitude, longitude, recordedAt]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        recordedAt:
          type: string
          format: date-time
          description: Momento del fix en el dispositivo, RFC 3339 en UTC. Más de 30 s en el futuro responde 400
    GeneratePlanRequest:
      type: object
      required: [deliveryDate]
      properties:
        deliveryDate: { type: string, format: date, example: "2026-10-16", description: "Delivery date, YYYY-MM-DD" }
    PlannedRoute:
      type: object
      required: [routeId, driverId, orderCount]
      properties:
        routeId: { type: string, description: Route identifier shared by Order Service and Driver Service }
        driverId: { type: string, format: uuid, description: Driver reserved for the route }
        orderCount: { type: integer, minimum: 0, description: Number of stops (orders) in the route }
        driverName: { type: string, description: Full name of the reserved driver }
        stops: { type: array, description: Stops ordered by sequence starting at 1, items: { $ref: "#/components/schemas/PlannedStop" } }
    PlannedStop:
      type: object
      required: [orderId, address, sequence]
      properties:
        orderId: { type: string, description: Order served at this stop }
        address: { type: string, description: Delivery address as stored by Order Service }
        sequence: { type: integer, minimum: 1, description: Visit order within the route }
    GeneratePlanResponse:
      type: object
      required: [planId, routes, unassignedOrderIds]
      properties:
        planId: { type: string, description: "Phase 1: derived as plan-<deliveryDate>; not persisted" }
        routes: { type: array, items: { $ref: "#/components/schemas/PlannedRoute" } }
        unassignedOrderIds: { type: array, items: { type: string }, description: "Phase 1: always empty; the planner assigns every order or fails" }
    CreateDriverRequest:
      type: object
      required: [email, password, firstName, lastName, birthDate, phone, vehicleType, identifier, plate, city]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        firstName: { type: string, maxLength: 50 }
        lastName: { type: string, maxLength: 50 }
        birthDate: { type: string, format: date, description: "YYYY-MM-DD. M├¡nimo 18 a├▒os cumplidos" }
        phone: { type: string, description: "N├║mero de contacto, 7 a 15 d├¡gitos y un + opcional al inicio" }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        identifier: { type: string, description: "Documento de identidad, 5 a 20 letras o d├¡gitos, ├║nico" }
        plate: { type: string, description: "Placa del veh├¡culo, 5 a 8 letras o d├¡gitos (se aceptan guiones), ├║nica" }
        city: { type: string, maxLength: 80 }
    VehicleType:
      type: string
      enum: [MOTORIZADO, AUTOMOVIL, SUV]
    DriverProfile:
      type: object
      required: [id, userId, firstName, lastName, birthDate, phone, vehicleType, identifier, plate, city, active, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        birthDate: { type: string, format: date }
        phone: { type: string }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        identifier: { type: string }
        plate: { type: string }
        city: { type: string }
        active: { type: boolean }
        status: { type: string, enum: [AVAILABLE, ASSIGNED, ON_ROUTE, OFFLINE] }
        createdAt: { type: string, format: date-time }
    DriverListItem:
      type: object
      required: [id, userId, fullName, firstName, lastName, phone, city, vehicleType, plate, active, status]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        fullName: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        city: { type: string }
        vehicleType: { $ref: "#/components/schemas/VehicleType" }
        plate: { type: string }
        active: { type: boolean }
        status: { type: string, enum: [AVAILABLE, ASSIGNED, ON_ROUTE, OFFLINE] }
    CreateDriverResponse:
      type: object
      required: [user, driver]
      properties:
        user: { $ref: "#/components/schemas/User" }
        driver: { $ref: "#/components/schemas/DriverProfile" }
    TrackingSnapshot:
      type: object
      description: Customer view of one order. Field names are snake_case, as the Gateway emits them. Never includes driver identity, route, other orders or coordinates.
      required: [order_id, status, delivery_address, delivery_window, eta, eta_unavailable_reason, stops_before, updated_at]
      properties:
        order_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OrderStatus" }
        delivery_address: { type: string }
        delivery_window:
          type: object
          required: [start, end]
          properties:
            start: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "Start of the delivery window, HH:mm" }
            end: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "End of the delivery window, HH:mm" }
        eta:
          type: object
          nullable: true
          description: ETA from the driver's latest fresh position. Null when there is no ETA; see eta_unavailable_reason.
          required: [distance_meters, duration_seconds]
          properties:
            distance_meters: { type: number }
            duration_seconds: { type: number }
        eta_unavailable_reason:
          type: string
          nullable: true
          enum: [null, no_route, no_position, stale_position, unavailable]
          description: Why eta is null. Null when eta is present.
        stops_before:
          type: integer
          nullable: true
          description: Open stops ahead of this order on its route. Null when the order has no route or the count is unavailable.
        road:
          type: array
          nullable: true
          description: Road path from the driver's latest fresh position to this order's delivery point, as [lat, lon] pairs. Never goes through other orders. Null when there is no fresh position or route planning is unavailable.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        updated_at: { type: string, format: date-time, description: Server time when the snapshot was built }
    StopStatusResponse:
      type: object
      required: [stopId, status]
      properties:
        stopId: { type: string, description: Same value as the stopId path parameter }
        status: { $ref: "#/components/schemas/OrderStatus" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INVALID_ARGUMENT
              description: |
                INVALID_ARGUMENT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT,
                FAILED_PRECONDITION, RATE_LIMITED, PAYLOAD_TOO_LARGE,
                UNSUPPORTED_MEDIA_TYPE, UPSTREAM_TIMEOUT, UPSTREAM_UNAVAILABLE, NOT_IMPLEMENTED, INTERNAL
            message: { type: string }
            requestId: { type: string, description: Igual a la cabecera X-Request-Id }
  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token ausente, inválido o expirado, o credenciales incorrectas
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Sin permiso sobre el recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotImplemented:
      description: Ruta reservada, sin backend todavía. Código NOT_IMPLEMENTED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicto con el estado actual
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: La operación no se puede hacer en el estado actual de la zona
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Límite de peticiones excedido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
