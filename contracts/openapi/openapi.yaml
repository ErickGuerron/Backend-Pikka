openapi: 3.0.3
info:
  title: Pikka API
  version: 1.0.0
  description: |
    API pública REST/JSON expuesta por el API Gateway. Clientes: aplicación web
    (React) y aplicación móvil (React Native, clientes y repartidores). Los
    microservicios internos no son accesibles directamente.

    Fase 1 cubre autenticación y usuarios. Pedidos, zonas, rutas, repartidores y
    seguimiento se agregan en las fases siguientes. El MVP del cliente
    (ADR 0006, ADR 0007, ADR 0008) agrega el signup público de CUSTOMER.
servers:
  - url: /
    description: Este API Gateway
tags:
  - name: health
    description: Liveness y readiness del Gateway
  - name: auth
    description: Inicio de sesión e identidad actual
  - name: users
    description: Administración de usuarios y roles
  - name: customers
    description: Consulta de clientes (solo ADMIN)
  - name: orders
    description: Registro y consulta de pedidos
  - name: surcharges
    description: Recargos por no entrega del cliente y su verificacion por el operador
  - name: zones
    description: Zonas de reparto y clasificación de coordenadas
  - name: coverage
    description: Cobertura de reparto visible para cualquier rol autenticado (solo zonas activas, sin configuración operativa)
  - name: products
    description: Catálogo de productos y stock (ADR 0009)
  - name: routes
    description: Generación del plan de rutas de una fecha (solo ADMIN y OPERATOR)
  - name: drivers
    description: Rutas del repartidor (ADR 0007) y reporte de posición. Solo rol DRIVER. La ruta del repartidor y el resultado de parada responden 501 hasta que exista el Routing Service; el avance de parada (status) ya está implementado. The driver creation (POST /drivers) is ADMIN only.
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: El proceso está vivo
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /ready:
    get:
      tags: [health]
      operationId: getReady
      summary: El Gateway y sus dependencias pueden recibir tráfico
      security: []
      responses:
        "200":
          description: Listo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Alguna dependencia no está lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y obtiene un token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Devuelve el usuario autenticado
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signupCustomer
      summary: Registra un cliente y devuelve un token de acceso (rol CUSTOMER)
      description: |
        Endpoint público para que un cliente se registre de forma autónoma desde
        la app móvil. No requiere JWT. Protegido por rate limit por IP
        (SIGNUP_RATE_PER_MINUTE, default 10/min).

        El token emitido sirve para `GET /api/v1/auth/me` y devuelve
        `role: "CUSTOMER"`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, phone, city]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 72, description: Máximo 72 bytes (límite de bcrypt) }
                fullName: { type: string, minLength: 1, maxLength: 120 }
                phone: { type: string, example: "+593 99 123 4567", description: "Teléfono de contacto. Se quitan espacios, guiones, puntos y paréntesis; debe quedar de 7 a 15 dígitos con un + inicial opcional. Se guarda normalizado" }
                city: { type: string, minLength: 2, maxLength: 80, description: Ciudad del cliente (se recorta antes de validar) }
      responses:
        "201":
          description: Cliente registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Lista todos los usuarios (solo ADMIN)
      description: Sin filtros ni paginación; el filtrado por rol (p. ej. CUSTOMER) lo hace el cliente.
      responses:
        "200":
          description: Usuarios
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      summary: Crea un usuario (solo ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Obtiene un usuario (ADMIN, OPERATOR o el propio usuario)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Edita nombre y/o rol de un usuario (solo ADMIN)
      description: |
        Los campos ausentes no cambian. Reglas: el rol CUSTOMER es inmutable y no se asigna
        por esta vía; el último ADMIN activo no puede dejar de serlo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Regla de negocio incumplida (p. ej. dejar sin ADMIN activo o cambiar un CUSTOMER)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [users]
      operationId: deactivateUser
      summary: Desactiva un usuario (borrado lógico, solo ADMIN)
      description: |
        Marca active=false y devuelve el usuario. Idempotente. Un ADMIN no puede desactivarse
        a sí mismo ni dejar el sistema sin ADMIN activo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Usuario desactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Regla de negocio incumplida (auto-desactivación o último ADMIN activo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Lista clientes paginados (solo ADMIN)
      description: Orden estable por fecha de creación e id.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, maximum: 100, default: 50 }
          description: Máximo de clientes a devolver. 0 o ausente usa 50; un valor mayor a 100 se limita a 100.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CustomerStatus" }
          description: Filtro opcional por estado.
      responses:
        "200":
          description: Página de clientes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/customers/{id}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Obtiene un cliente por id (solo ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/customers/{id}/status:
    patch:
      tags: [customers]
      operationId: setCustomerStatus
      summary: Cambia el estado de un cliente (solo ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVO, BLOQUEADO_POR_SALDO, BLOQUEADO_POR_INCIDENCIAS] }
      responses:
        "200":
          description: Cliente con el nuevo estado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Lista pedidos (ADMIN u OPERATOR)
      description: |
        Contrato de Sprint 1; transporte implementado en Sprint 2.
        DRIVER no tiene acceso. El filtrado por alcance se define con el rol CUSTOMER.
        Orden descendente por createdAt y ascendente por id en empates.
        Sin resultados devuelve un arreglo vacío.
      parameters:
        - name: deliveryDate
          in: query
          schema: { type: string, format: date }
          description: Filtra por fecha de entrega, independientemente de createdAt.
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Pedidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [orders]
      operationId: createOrder
      summary: Registra un pedido del cliente autenticado (solo CUSTOMER)
      description: |
        El servidor asigna id, createdAt y el estado. La validación automática (ADR 0007)
        consulta la zona de la dirección y el estado del cliente. Si alguna regla no se
        cumple, el pedido queda en PENDING_REVIEW con reviewReasons; si no, en PENDING.
        Una dirección fuera de zona no es un error: el pedido entra a la cola de excepciones.
        La fecha de entrega debe ser hoy o posterior en la zona horaria de operación.
        La ventana no cruza medianoche: windowEnd debe ser posterior a windowStart.
        Si Zone Service no responde, no se registra el pedido y se devuelve 503.
        Una cuenta bloqueada por saldo pendiente (BLOQUEADO_POR_SALDO, ADR 0006 sección 5) no puede crear pedidos:
        se rechaza con 403 antes de geocodificar, reservar stock o guardar nada. Una cuenta bloqueada por
        incidencias sí registra el pedido, que entra a la cola de excepciones con CUSTOMER_BLOCKED.
        ADMIN, OPERATOR y DRIVER reciben 403 antes de que se valide el cuerpo: el personal revisa
        los pedidos de los clientes pero no los registra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Pedido registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Zone Service no disponible; el pedido no se registró
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/orders/mine:
    get:
      tags: [orders]
      operationId: listMyOrders
      summary: Lista los pedidos del cliente autenticado (solo CUSTOMER)
      description: |
        Solo devuelve pedidos del cliente de la sesión; nunca de otros clientes (BOLA, ADR 0007).
        Orden descendente por createdAt y ascendente por id en empates. Sin pedidos devuelve un arreglo vacío.
      responses:
        "200":
          description: Pedidos del cliente
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Obtiene un pedido (ADMIN u OPERATOR)
      description: Contrato de Sprint 1; transporte implementado en Sprint 2.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/notifications/mine:
    get:
      tags: [orders]
      operationId: listMyNotifications
      summary: Lista los avisos del cliente autenticado (solo CUSTOMER)
      description: |
        Avisos sobre la revisión de sus pedidos (ADR 0007, sección 3): pedido en revisión, confirmado,
        corregido o rechazado. Del más reciente al más antiguo. Solo devuelve avisos de la sesión.
      responses:
        "200":
          description: Avisos del cliente
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orders/exceptions:
    get:
      tags: [orders]
      operationId: listOrderExceptions
      summary: Cola de excepciones de pedidos pendientes de revisión (ADMIN u OPERATOR)
      description: Pedidos cuya validación automática no se cumplió (ADR 0007, sección 3). El operador los confirma, corrige o rechaza.
      responses:
        "200":
          description: Pedidos en revisión
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orders/{id}/review:
    post:
      tags: [orders]
      operationId: reviewOrder
      summary: Confirma, corrige o rechaza un pedido en revisión (ADMIN u OPERATOR)
      description: Solo aplica a pedidos en estado PENDING_REVIEW. Toda decisión queda registrada con motivo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderReviewRequest" }
      responses:
        "200":
          description: Pedido actualizado según la decisión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/surcharges/pending-verification:
    get:
      tags: [surcharges]
      operationId: listSurchargesPendingVerification
      summary: Recargos por direccion incorrecta que esperan verificacion (ADMIN u OPERATOR)
      description: Cola del operador, del mas antiguo al mas reciente (ADR 0006, enmienda). Un recargo WRONG_ADDRESS no se cobra hasta que el operador lo confirme.
      responses:
        "200":
          description: Recargos en estado PENDING_VERIFICATION
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Surcharge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/surcharges/{id}/verification:
    post:
      tags: [surcharges]
      operationId: resolveSurchargeVerification
      summary: Confirma o dispensa un recargo en verificacion (ADMIN u OPERATOR)
      description: |
        CONFIRM: el cliente es responsable y el recargo sigue el flujo normal (15 % del siguiente pedido).
        WAIVE: el cliente no es responsable y no se cobra. La decision queda registrada con el operador, el motivo y la hora.
        Solo aplica a recargos en PENDING_VERIFICATION; uno ya resuelto responde 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SurchargeVerificationRequest" }
      responses:
        "200":
          description: Recargo con la decision registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Surcharge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/customers/recidivists:
    get:
      tags: [surcharges]
      operationId: listRecidivists
      summary: Lista los clientes reincidentes (ADMIN u OPERATOR)
      description: |
        Los clientes con la marca de reincidente (ADR 0006), la marca mas antigua primero. Trae solo lo necesario para
        decidir un recargo extra y ubicar al cliente: nombre, telefono de contacto (el del ultimo pedido, o el del
        cliente si no tiene pedidos), la fecha de la marca, el saldo pendiente y si el recargo extra ya se aplico
        (solo se aplica una vez por marca). No incluye correo ni direccion. CUSTOMER y DRIVER reciben 403.
      responses:
        "200":
          description: Reincidentes, o un arreglo vacio
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recidivist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/customers/{id}/recidivism-charge:
    post:
      tags: [surcharges]
      operationId: applyRecidivismCharge
      summary: Aplica un recargo extra a un cliente reincidente (ADMIN u OPERATOR)
      description: |
        El monto y el motivo los decide el operador (ADR 0006, seccion 1). El monto se suma al saldo pendiente del
        cliente en la misma operacion y la decision queda auditada con el operador y la hora.
        Solo aplica a clientes marcados como reincidentes (tres no entregas del cliente en un plazo de 14 dias) y una
        vez por reincidencia: un segundo intento responde 409; un cliente sin la marca responde 422.
        El monto tiene un tope que fija el negocio (variable RECIDIVISM_CHARGE_MAX, 50.00 de inicio): un monto mayor
        responde 400 con el tope en el mensaje y no toca el saldo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecidivismChargeRequest" }
      responses:
        "201":
          description: Recargo extra aplicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecidivismCharge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/customers/me/balance:
    get:
      tags: [surcharges]
      operationId: getMyBalance
      summary: Muestra al cliente lo que debe, linea por linea (solo CUSTOMER)
      description: |
        Saldo pendiente, estado de la cuenta y cada linea con su motivo y la fecha limite de pago (ADR 0006,
        secciones 4 y 5). Una cuenta bloqueada por saldo puede consultarlo: asi sabe cuanto pagar. Las lineas
        van de la mas antigua a la mas reciente. El motivo del recargo extra es siempre RECIDIVISM; la
        justificacion del operador es una nota interna y no se muestra. `simulated` es siempre true.
      responses:
        "200":
          description: Saldo del cliente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyBalance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/customers/me/balance/payment:
    post:
      tags: [surcharges]
      operationId: payMyBalance
      summary: Paga el saldo pendiente completo con el cobro simulado (solo CUSTOMER)
      description: |
        Cobra todo el saldo pendiente del cliente autenticado con la tarjeta simulada (ADR 0006, sección 5). No lleva
        cuerpo: no se elige el monto, solo se paga el saldo completo. Si el cobro se aprueba, los recargos quedan
        pagados y una cuenta BLOQUEADO_POR_SALDO vuelve a ACTIVO en ese momento (`unblocked: true`). Si la tarjeta
        simulada rechaza, responde 200 con `SIMULATED_DECLINED` y nada cambia. No hay pasarela real: `simulated`
        es siempre true y ningún dato de tarjeta se pide ni se guarda.
        Sin saldo responde 422; si el saldo cambió mientras se pagaba, el cobro se devuelve y responde 409.
      responses:
        "200":
          description: Resultado del cobro simulado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalancePayment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/customers/{id}/recidivist/clear:
    post:
      tags: [surcharges]
      operationId: clearRecidivist
      summary: Quita la marca de reincidente a un cliente (solo ADMIN)
      description: |
        Solo un administrador puede quitar la marca (ADR 0006, F5); el motivo (5 a 300 caracteres) y quien lo hizo
        quedan auditados. No borra los recargos extra ya cobrados ni cambia el saldo. Tras quitarla, una nueva
        reincidencia vuelve a marcar al cliente y permite otro recargo extra. Un OPERATOR responde 403; un cliente
        sin la marca responde 422.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClearRecidivistRequest" }
      responses:
        "200":
          description: Marca quitada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecidivistClear" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelMyOrder
      summary: Cancela un pedido propio del cliente (solo CUSTOMER)
      description: |
        Solo aplica a pedidos en PENDING o ROUTE_ASSIGNED (ADR 0007, sección 8). Una cuenta bloqueada por saldo
        pendiente (BLOQUEADO_POR_SALDO, ADR 0006 sección 5) no puede cancelar y responde 403. El stock de sus productos
        vuelve al catálogo en la misma operación. Un pedido de otro cliente responde 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pedido cancelado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/orders/{id}/tracking:
    get:
      tags: [orders]
      operationId: getOrderTracking
      summary: Snapshot of the authenticated customer's order (CUSTOMER only)
      description: |
        Order status and, when the assigned driver has a fresh position, the ETA to the delivery point.
        A foreign or unknown order responds 404 with the same body. The snapshot never includes driver
        identity, route, other orders or coordinates.

        `eta` is null when there is no ETA. `eta_unavailable_reason` says why: `no_route` (the order has no
        route yet), `no_position` (the driver has not reported a position), `stale_position` (the last position
        is too old) or `unavailable` (Tracking Service did not answer). A stale ETA is never shown.

        `stops_before` is the number of open stops ahead of this order on its route. It is null when the order
        has no route or the count fails. A failure in the stop count or in the ETA does not fail the snapshot.

        For live updates, see `GET /api/v1/orders/{id}/tracking/ws`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Order Service unavailable. Code UPSTREAM_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/orders/{id}/tracking/ws:
    get:
      tags: [orders]
      operationId: watchOrderTracking
      summary: WebSocket for the authenticated customer's order tracking (CUSTOMER only)
      x-websocket: true
      description: |
        This is a WebSocket. OpenAPI 3.x cannot describe sockets natively, so it is documented as a GET.
        The client sends `Upgrade: websocket` and the handshake headers of RFC 6455.

        **Authentication.** Browsers cannot send an `Authorization` header on a WebSocket, so the JWT travels
        as the second subprotocol: `Sec-WebSocket-Protocol: pikka.v1, <jwt>`. The server accepts `pikka.v1` and
        validates the JWT with the same verifier as the HTTP routes. The token never appears in the URL or in logs.
        This route does not read the `Authorization` header, so `security` is empty.

        **Rejections before the upgrade.** Authentication and ownership are checked before the socket opens:
        - 401: subprotocol missing or malformed, or token invalid or expired (JSON error body).
        - 403: role other than CUSTOMER (JSON error body). An Origin not allowed by the CORS list is also 403,
          with a plain-text body from the WebSocket library.
        - 404: foreign or unknown order, same body in both cases (JSON error body).
        - 400 or 426: invalid WebSocket handshake (version, key or Upgrade headers). Plain-text body from the library.

        **Messages.** Each message is a text frame with a JSON object of the `TrackingSnapshot` schema.
        - On connect, the server sends the current snapshot.
        - Then it polls every 5 s (`TRACKING_POLL_INTERVAL`) and sends a message only when the snapshot changed.
          `updated_at` is ignored when comparing.
        - A failed poll is skipped and retried on the next tick; the socket stays open.
        - The client should not send data messages. A data message closes the socket with code 1008 (policy violation).
        - When the client goes away, the connection ends.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          description: "Must be `pikka.v1, <jwt>`. The first item is the protocol name; the second is the access token."
          schema: { type: string, example: "pikka.v1, <jwt>" }
      responses:
        "101":
          description: Switching Protocols. The server sends the snapshot on connect and then each change
        "400":
          description: Invalid WebSocket handshake (plain-text body from the library)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role other than CUSTOMER (JSON error body), or Origin not allowed (plain-text body)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "426":
          description: Missing Upgrade or Connection header (plain-text body from the library)
