syntax = "proto3";

package customer.v1;

option go_package = "github.com/ErickGuerron/Backend-Pikka/contracts/gen/go/customer/v1;customerv1";

// CustomerService atiende operaciones de dominio del cliente.
// Consumido por el API Gateway y otros servicios internos.
service CustomerService {
  // CreateCustomer registra un Customer nuevo (a partir de un user_id CUSTOMER).
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);

  // GetByUserID devuelve el Customer asociado a un user_id.
  rpc GetByUserID(GetByUserIDRequest) returns (GetByUserIDResponse);

  // GetByID devuelve el Customer por su id interno.
  //
  // Códigos de estado gRPC: INVALID_ARGUMENT si id no es un UUID; NOT_FOUND si no existe.
  rpc GetByID(GetByIDRequest) returns (GetByIDResponse);

  // ListCustomers devuelve una página de Customers ordenados por created_at e id
  // (ascendente, orden estable), con filtro opcional por estado. Solo lo invoca ADMIN.
  //
  // Códigos de estado gRPC: INVALID_ARGUMENT si limit u offset son negativos o si
  // status no es un estado válido.
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);

  // UpdateStatus actualiza el estado del Customer (solo ADMIN lo invoca).
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);

  // CanCreateOrders indica si el cliente puede crear pedidos.
  rpc CanCreateOrders(CanCreateOrdersRequest) returns (CanCreateOrdersResponse);
}

message Customer {
  string id = 1;                       // UUID v4
  string user_id = 2;                  // UUID v4
  string full_name = 3;
  string email = 4;
  string status = 5;                   // ACTIVO | BLOQUEADO_POR_SALDO | BLOQUEADO_POR_INCIDENCIAS
  string pending_surcharge = 6;        // NUMERIC(12,2) como string
  string created_at = 7;               // RFC 3339
  string updated_at = 8;               // RFC 3339
  string phone = 9;                    // normalizado (solo dígitos y "+" inicial); vacío en clientes antiguos
  string city = 10;                    // 2 a 80 caracteres; vacío en clientes antiguos
  string recidivist_at = 11;           // RFC 3339; vacío si el cliente no es reincidente (ADR 0006)
}

message CreateCustomerRequest {
  string user_id = 1;                  // UUID v4 del CUSTOMER en auth.users
  string full_name = 2;
  string email = 3;
  string phone = 4;                    // obligatorio: 7 a 15 dígitos, "+" inicial opcional
  string city = 5;                     // obligatorio: 2 a 80 caracteres
}

message CreateCustomerResponse {
  Customer customer = 1;
}

message GetByUserIDRequest {
  string user_id = 1;
}

message GetByUserIDResponse {
  Customer customer = 1;
}

message GetByIDRequest {
  string id = 1;                       // UUID v4 del Customer
}

message GetByIDResponse {
  Customer customer = 1;
}

message ListCustomersRequest {
  // Cantidad máxima de clientes a devolver. Cero usa el valor por defecto (50).
  // El máximo es 100: un valor mayor se limita a 100 y no es un error.
  // Un valor negativo falla con INVALID_ARGUMENT.
  int32 limit = 1;
  // Cantidad de clientes a saltar. Cero empieza en el primero. Negativo falla con INVALID_ARGUMENT.
  int32 offset = 2;
  // Filtro opcional por estado (ACTIVO | BLOQUEADO_POR_SALDO | BLOQUEADO_POR_INCIDENCIAS).
  // Vacío no filtra.
  string status = 3;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  // Total de clientes que cumplen el filtro (independiente de limit/offset).
  int32 total = 2;
}

message UpdateStatusRequest {
  string id = 1;
  string status = 2;
}

message UpdateStatusResponse {
  Customer customer = 1;
}

message CanCreateOrdersRequest {
  string user_id = 1;
}

message CanCreateOrdersResponse {
  bool can_create = 1;
}