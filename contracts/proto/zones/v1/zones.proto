syntax = "proto3";

package zones.v1;

option go_package = "github.com/ErickGuerron/Backend-Pikka/contracts/gen/go/zones/v1;zonesv1";

// ZoneService gestiona las zonas geográficas de reparto y clasifica coordenadas.
// Solo es consumido por el API Gateway y otros servicios internos (Routing).
service ZoneService {
  // CreateZone registra una zona definida por un anillo cerrado de coordenadas.
  rpc CreateZone(CreateZoneRequest) returns (CreateZoneResponse);

  // GetZone devuelve una zona por su identificador.
  rpc GetZone(GetZoneRequest) returns (GetZoneResponse);

  // ClassifyPoint devuelve la zona que contiene una coordenada.
  // Si varias zonas la contienen, devuelve la de menor área.
  // Responde NOT_FOUND si ninguna zona la contiene.
  rpc ClassifyPoint(ClassifyPointRequest) returns (ClassifyPointResponse);

  // ListZones devuelve todas las zonas registradas.
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse);

  // ListCoverageZones devuelve solo las zonas ACTIVE, para mostrar la cobertura a cualquier rol
  // autenticado (incluido CUSTOMER). No cambia la autorización de ListZones.
  rpc ListCoverageZones(ListCoverageZonesRequest) returns (ListCoverageZonesResponse);

  // UpdateZone reemplaza la geometría y los datos de una zona existente.
  rpc UpdateZone(UpdateZoneRequest) returns (UpdateZoneResponse);

  // SetZoneStatus activa o desactiva una zona. El motivo es obligatorio y queda en la bitácora.
  rpc SetZoneStatus(SetZoneStatusRequest) returns (SetZoneStatusResponse);

  // DeleteZone borra físicamente una zona. Solo se permite si está INACTIVE.
  rpc DeleteZone(DeleteZoneRequest) returns (DeleteZoneResponse);
}

message ListZonesRequest {}

message ListZonesResponse {
  repeated Zone zones = 1;
}

message ListCoverageZonesRequest {}

message ListCoverageZonesResponse {
  repeated Zone zones = 1;
}

message UpdateZoneRequest {
  string id = 1;
  string code = 2;
  string name = 3;
  repeated Coordinate ring = 4;
  repeated Ring holes = 5;
  // Configuración operativa de la zona. Reemplaza la configuración completa.
  ZoneSettings settings = 6;
  // Versión que el cliente vio por última vez. 0 = sin control de concurrencia. Si no coincide, responde ABORTED.
  int32 expected_version = 7;
}

message UpdateZoneResponse {
  Zone zone = 1;
}

message Coordinate {
  double latitude = 1;
  double longitude = 2;
}

// Ring es un anillo cerrado de coordenadas: el primer punto coincide con el último.
message Ring {
  repeated Coordinate points = 1;
}

// ZoneSettings es la configuración operativa de una zona: depósito de salida, capacidad de ruta,
// horario de servicio, cortes y prioridad.
message ZoneSettings {
  string description = 1;
  string depot_name = 2;
  double depot_latitude = 3;
  double depot_longitude = 4;
  // Máximo de pedidos por ruta (ej. 4; zonas con poco volumen usan 1 o 2).
  int32 max_orders_per_route = 5;
  // Capacidad de carga por ruta, en kilogramos.
  double default_route_capacity_kg = 6;
  // Zona horaria IANA, ej. America/Guayaquil.
  string timezone = 7;
  // Días de servicio: MON, TUE, WED, THU, FRI, SAT, SUN.
  repeated string service_days = 8;
  // Horas locales HH:MM.
  string delivery_window_start = 9;
  string delivery_window_end = 10;
  string cutoff_time = 11;
  string dispatch_time = 12;
  // NORMAL, HIGH o LOW.
  string priority = 13;
  // Límite de pedidos por fecha de entrega.
  int32 daily_order_limit = 14;
}

message Zone {
  string id = 1;
  string code = 2;
  string name = 3;
  // Anillo cerrado: el primer punto coincide con el último.
  repeated Coordinate ring = 4;
  // RFC 3339, UTC.
  string created_at = 5;
  // Huecos de la zona (dona). Cada uno es un anillo cerrado dentro del exterior. Vacío si no hay huecos.
  repeated Ring holes = 6;
  // ACTIVE o INACTIVE. Una zona inactiva no se usa para clasificar puntos y se conserva para el historial.
  string status = 7;
  // Motivo del último cambio de estado. Vacío si nunca se ha desactivado.
  string status_reason = 8;
  ZoneSettings settings = 9;
  // Versión de la zona; sube en cada cambio. Úsala como expected_version al editar.
  int32 version = 10;
  // RFC 3339, UTC.
  string updated_at = 11;
  string created_by = 12;
  string updated_by = 13;
}

message CreateZoneRequest {
  string code = 1;
  string name = 2;
  repeated Coordinate ring = 3;
  // Huecos opcionales (dona). Cada uno debe quedar dentro del anillo exterior y no tocarlo.
  repeated Ring holes = 4;
  ZoneSettings settings = 5;
}

message CreateZoneResponse {
  Zone zone = 1;
}

message GetZoneRequest {
  string id = 1;
}

message GetZoneResponse {
  Zone zone = 1;
}

message ClassifyPointRequest {
  Coordinate point = 1;
}

message ClassifyPointResponse {
  Zone zone = 1;
}

message SetZoneStatusRequest {
  string id = 1;
  string status = 2;
  string reason = 3;
}

message SetZoneStatusResponse {
  Zone zone = 1;
}

message DeleteZoneRequest {
  string id = 1;
  string reason = 2;
}

message DeleteZoneResponse {}
