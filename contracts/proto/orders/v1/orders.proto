syntax = "proto3";

package orders.v1;

option go_package = "github.com/ErickGuerron/Backend-Pikka/contracts/gen/go/orders/v1;ordersv1";

// OrderService owns orders. The Gateway exposes REST; Routing uses gRPC.
// Authorization is enforced by the service using the propagated user metadata.
service OrderService {
  // CreateOrder accepts delivery data only. ID, status and created_at are
  // assigned by the service. Malformed input returns INVALID_ARGUMENT.
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  // GetOrder returns NOT_FOUND for an unknown ID.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  // ListOrders applies optional filters. An empty result is an empty list.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  // GetPendingOrders selects only PENDING orders for a required delivery date,
  // independently of when they were registered. Used by Routing in Sprint 3.
  rpc GetPendingOrders(GetPendingOrdersRequest) returns (GetPendingOrdersResponse);
  // Operations already published in OpenAPI; implemented in a later sprint.
  rpc ListOrderExceptions(ListOrderExceptionsRequest) returns (ListOrderExceptionsResponse);
  // ReviewOrder only accepts PENDING_REVIEW; another state returns
  // ABORTED (HTTP 409). An unknown ID returns NOT_FOUND.
  rpc ReviewOrder(ReviewOrderRequest) returns (ReviewOrderResponse);
  // ListMyOrders returns the orders of the customer identified by the
  // propagated user metadata. Only the CUSTOMER role can call it.
  rpc ListMyOrders(ListMyOrdersRequest) returns (ListMyOrdersResponse);
  // ListMyNotifications returns the notices the customer received about the
  // review of their orders, newest first. Only the CUSTOMER role can call it.
  rpc ListMyNotifications(ListMyNotificationsRequest) returns (ListMyNotificationsResponse);
  // CancelOrder cancels an order of the authenticated CUSTOMER. Only PENDING or ROUTE_ASSIGNED can be
  // cancelled; another state returns ABORTED (HTTP 409). An order of another customer returns NOT_FOUND.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  // GetMyOrder returns one order of the authenticated CUSTOMER. An order of another customer
  // or an unknown ID returns NOT_FOUND (never PERMISSION_DENIED). Only the CUSTOMER role can call it.
  rpc GetMyOrder(GetMyOrderRequest) returns (GetMyOrderResponse);
  // AssignOrdersToRoute moves every listed order from PENDING to ROUTE_ASSIGNED
  // in one transaction. Internal, called by Routing. Blank route_id or empty
  // order_ids returns INVALID_ARGUMENT; an unknown ID returns NOT_FOUND; any
  // order not in PENDING returns ABORTED (HTTP 409) and none is changed.
  rpc AssignOrdersToRoute(AssignOrdersToRouteRequest) returns (AssignOrdersToRouteResponse);
  // AdvanceRouteStop moves one order of a route forward for its driver: ROUTE_ASSIGNED -> PICKED_UP
  // -> IN_TRANSIT. Internal, called by the Gateway after it verified the driver owns the route. Blank
  // route_id or order_id returns INVALID_ARGUMENT; a target other than PICKED_UP or IN_TRANSIT returns
  // INVALID_ARGUMENT; an order not on that route returns NOT_FOUND; an illegal transition returns
  // FAILED_PRECONDITION. DELIVERED and NOT_DELIVERED belong to RegisterDelivery, not to this RPC.
  rpc AdvanceRouteStop(AdvanceRouteStopRequest) returns (AdvanceRouteStopResponse);
  // RecordRouteStopOutcome closes a stop of the driver's route: IN_TRANSIT -> DELIVERED or NOT_DELIVERED.
  // Internal, called by the Gateway only after Driver Service accepted the delivery record. Blank route_id
  // or order_id returns INVALID_ARGUMENT; an outcome other than DELIVERED or NOT_DELIVERED returns
  // INVALID_ARGUMENT; an order not on that route returns NOT_FOUND; an order not IN_TRANSIT returns
  // FAILED_PRECONDITION.
  rpc RecordRouteStopOutcome(RecordRouteStopOutcomeRequest) returns (RecordRouteStopOutcomeResponse);
  // StopsBeforeForOrder counts the orders of the same route with a smaller stop_sequence that are still
  // open (not DELIVERED, NOT_DELIVERED or CANCELLED). Only the CUSTOMER role can call it, and only for an
  // order it owns: a foreign or unknown order returns NOT_FOUND. An order without route or stop_sequence
  // returns 0.
  rpc StopsBeforeForOrder(StopsBeforeForOrderRequest) returns (StopsBeforeForOrderResponse);
  // ListDriverRouteStops returns the stops of a route for its DRIVER, ordered by stop_sequence.
  // Only DRIVER. Customer data (name, phone) is never in DriverRouteStop.
  rpc ListDriverRouteStops(ListDriverRouteStopsRequest) returns (ListDriverRouteStopsResponse);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PENDING_REVIEW = 2;
  ORDER_STATUS_ROUTE_ASSIGNED = 3;
  ORDER_STATUS_PICKED_UP = 4;
  ORDER_STATUS_IN_TRANSIT = 5;
  ORDER_STATUS_DELIVERED = 6;
  ORDER_STATUS_NOT_DELIVERED = 7;
  ORDER_STATUS_CANCELLED = 8;
}

enum ReviewReason {
  REVIEW_REASON_UNSPECIFIED = 0;
  REVIEW_REASON_ZONE_NOT_COVERED = 1;
  REVIEW_REASON_INVALID_WINDOW = 2;
  REVIEW_REASON_CAPACITY_EXCEEDED = 3;
  REVIEW_REASON_CUSTOMER_BLOCKED = 4;
  // La dirección no pudo localizarse en el mapa (geocodificación sin resultado).
  REVIEW_REASON_ADDRESS_NOT_LOCATED = 5;
}

enum ReviewAction {
  REVIEW_ACTION_UNSPECIFIED = 0;
  REVIEW_ACTION_CONFIRM = 1;
  REVIEW_ACTION_CORRECT = 2;
  REVIEW_ACTION_REJECT = 3;
}

message Order {
  string id = 1;
  // Trimmed address, 5 to 300 Unicode characters.
  string address = 2;
  // WGS 84: latitude [-90, 90], longitude [-180, 180]; both finite.
  double latitude = 3;
  double longitude = 4;
  // Calendar date YYYY-MM-DD in the operating timezone, not a UTC instant.
  string delivery_date = 5;
  // Local times HH:mm on delivery_date. End must be strictly after start.
  string window_start = 6;
  string window_end = 7;
  OrderStatus status = 8;
  // Empty outside PENDING_REVIEW.
  repeated ReviewReason review_reasons = 9;
  // Registration instant in RFC 3339, UTC. Independent of delivery_date.
  string created_at = 10;
  // Zone resolved when the order was registered. Empty when the order has no zone
  // (for example PENDING_REVIEW with ZONE_NOT_COVERED). Used by Routing for capacity.
  string zone_id = 11;
  // Reference to find the delivery point (3 to 200 characters). Empty in orders created before it existed.
  string address_reference = 12;
  // Optional postal code (4 to 10 letters, digits or hyphen). Empty when not given.
  string postal_code = 13;
  // Contact phone for the delivery, normalized (digits and optional leading "+"). Empty in old orders.
  string contact_phone = 14;
  // Driver route the order was assigned to. Empty until Routing assigns it. Used internally to find
  // the assigned driver. Internal field: the Gateway customer DTO must not expose it.
  string route_id = 15;
}

message CreateOrderRequest {
  string address = 1;
  // Both must be present. Optional presence distinguishes valid zero degrees
  // from an omitted coordinate; omission returns INVALID_ARGUMENT.
  optional double latitude = 2;
  optional double longitude = 3;
  // Valid YYYY-MM-DD, today or later in the operating timezone.
  string delivery_date = 4;
  string window_start = 5;
  string window_end = 6;
  // Productos del pedido (ADR 0009). Obligatorio: al menos uno, sin repetir producto.
  // Cada producto debe estar activo y tener stock suficiente; si no, el pedido no se guarda.
  repeated OrderItemRequest items = 7;
  // Required, 3 to 200 characters after trimming.
  string address_reference = 8;
  // Optional, 4 to 10 letters, digits or hyphen.
  string postal_code = 9;
  // Required, 7 to 15 digits with optional leading "+"; spaces, hyphens, dots and parentheses are stripped.
  string contact_phone = 10;
}

// Un producto del catálogo y la cantidad pedida. El precio lo fija el servidor, no el cliente.
message OrderItemRequest {
  string product_id = 1;
  // Entre 1 y 50.
  int64 quantity = 2;
}

message CreateOrderResponse {
  Order order = 1;
  // Productos guardados con el pedido, con el precio del momento.
  repeated OrderLine items = 2;
  // Suma de los subtotales, como texto decimal con dos decimales.
  string total = 3;
}

// Un producto del pedido tal como quedó guardado: nombre y precio del momento del pedido.
message OrderLine {
  string product_id = 1;
  string name = 2;
  string unit_price = 3;
  int64 quantity = 4;
}

message GetOrderRequest {
  // Required UUID.
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  // Empty means all dates; otherwise YYYY-MM-DD.
  string delivery_date = 1;
  // UNSPECIFIED means all states; unrecognized values are invalid.
  OrderStatus status = 2;
}

message ListOrdersResponse {
  // Ordered by created_at descending, then id ascending for ties.
  repeated Order orders = 1;
}

message GetPendingOrdersRequest {
  // Required YYYY-MM-DD. Filters by delivery_date, never by created_at.
  string delivery_date = 1;
}

message GetPendingOrdersResponse {
  repeated Order orders = 1;
}

message ListOrderExceptionsRequest {}

message ListOrderExceptionsResponse {
  repeated Order orders = 1;
}

// Presence distinguishes omitted fields from values supplied by the operator.
message OrderCorrection {
  optional string address = 1;
  optional string delivery_date = 2;
  optional string window_start = 3;
  optional string window_end = 4;
}

message ReviewOrderRequest {
  string id = 1;
  ReviewAction action = 2;
  // Required audit reason, 5 to 300 characters after trimming.
  string reason = 3;
  // Used only for CORRECT. Omitted fields preserve their current values.
  OrderCorrection correction = 4;
}

message ReviewOrderResponse {
  Order order = 1;
}

message ListMyOrdersRequest {}

message ListMyOrdersResponse {
  // Ordered by created_at descending, then id ascending for ties.
  repeated Order orders = 1;
}

message ListMyNotificationsRequest {}

message ListMyNotificationsResponse {
  // Newest first, then id ascending for ties.
  repeated Notification notifications = 1;
}

// Notice sent to the customer when the automatic validation or an operator review changes an order.
message Notification {
  string id = 1;
  string order_id = 2;
  // ORDER_IN_REVIEW, ORDER_CONFIRMED, ORDER_CORRECTED or ORDER_REJECTED.
  string kind = 3;
  // Review reasons (ORDER_IN_REVIEW) or the operator's audit reason (other kinds).
  string detail = 4;
  // RFC 3339, UTC.
  string created_at = 5;
  bool read = 6;
}

message CancelOrderRequest {
  // Required UUID of an order owned by the caller.
  string id = 1;
}

message CancelOrderResponse {
  Order order = 1;
}

message GetMyOrderRequest {
  // Required UUID of an order owned by the caller.
  string order_id = 1;
}

message GetMyOrderResponse {
  Order order = 1;
}

// One order of a route and its position in the route (1 is the first stop).
message OrderStop {
  string order_id = 1;
  // Integer >= 1, unique within the route.
  int32 sequence = 2;
}

message AssignOrdersToRouteRequest {
  // Required route identifier chosen by Routing.
  string route_id = 1;
  // Legacy form: order UUIDs with no stop sequence (stored as unassigned). Ignored when stops is set.
  repeated string order_ids = 2;
  // Preferred form: every order with its stop sequence, all PENDING. When set, order_ids is ignored.
  // A sequence below 1, or repeated within the route, returns INVALID_ARGUMENT.
  repeated OrderStop stops = 3;
}

message AdvanceRouteStopRequest {
  // Required route the driver is running.
  string route_id = 1;
  // Required UUID of an order on that route.
  string order_id = 2;
  // PICKED_UP or IN_TRANSIT. Any other value returns INVALID_ARGUMENT.
  OrderStatus target_status = 3;
}

message AdvanceRouteStopResponse {
  Order order = 1;
}

message RecordRouteStopOutcomeRequest {
  // Required route the driver is running.
  string route_id = 1;
  // Required UUID of an order on that route.
  string order_id = 2;
  // DELIVERED or NOT_DELIVERED. Any other value returns INVALID_ARGUMENT.
  OrderStatus outcome = 3;
}

message RecordRouteStopOutcomeResponse {
  Order order = 1;
}

message StopsBeforeForOrderRequest {
  // Required UUID of an order owned by the caller.
  string order_id = 1;
}

message StopsBeforeForOrderResponse {
  // Open stops of the same route ahead of this order. 0 when the order has no route or stop_sequence.
  int32 stops_before = 1;
}

message AssignOrdersToRouteResponse {
  // The orders in the request, now ROUTE_ASSIGNED.
  repeated Order orders = 1;
}

message ListDriverRouteStopsRequest {
  // Required route id of the driver's own route.
  string route_id = 1;
}

message ListDriverRouteStopsResponse {
  repeated DriverRouteStop stops = 1;
}

// One stop of a driver's route. Carries no customer identity.
message DriverRouteStop {
  string order_id = 1;
  int32 sequence = 2;
  string address = 3;
  double latitude = 4;
  double longitude = 5;
  // Local times HH:mm.
  string window_start = 6;
  string window_end = 7;
  OrderStatus status = 8;
}
