syntax = "proto3";

package drivers.v1;

option go_package = "github.com/ErickGuerron/Backend-Pikka/contracts/gen/go/drivers/v1;driversv1";

// DriverService gestiona la disponibilidad y la reserva de repartidores.
// Solo es consumido por otros servicios internos (por ejemplo, el servicio de rutas); nunca por clientes.
service DriverService {
  // FindAvailableDrivers devuelve solo los repartidores activos cuyo estado es
  // DRIVER_STATUS_AVAILABLE, como DriverSummary (solo identificadores).
  //
  // Códigos de estado gRPC que el servidor debe devolver:
  //
  //   - INVALID_ARGUMENT: limit es negativo.
  //
  // Un limit mayor que el máximo no es un error: se limita al máximo (100).
  rpc FindAvailableDrivers(FindAvailableDriversRequest) returns (FindAvailableDriversResponse);

  // ReserveDriver reserva un repartidor para una ruta. Un repartidor solo puede
  // atender una ruta a la vez. Si tiene éxito, el Driver devuelto queda en estado
  // DRIVER_STATUS_ASSIGNED.
  //
  // driver_id y route_id son obligatorios y no pueden estar en blanco.
  //
  // Idempotencia: repetir la llamada con el mismo driver_id y route_id mientras el
  // repartidor conserva esa ruta (estado ASSIGNED u ON_ROUTE) tiene éxito sin efectos
  // adicionales y devuelve el Driver actual. Esto se cumple incluso si el repartidor
  // fue desactivado después de la reserva. Límite: una vez que la ruta fue liberada o
  // completada, una llamada duplicada y tardía volvería a reservar al repartidor, así
  // que el llamador (Routing Service) no debe reintentar una ruta ya finalizada.
  //
  // Reservar un repartidor que ya está reservado para otra ruta falla.
  //
  // Códigos de estado gRPC que el servidor debe devolver:
  //
  //   - INVALID_ARGUMENT: driver_id o route_id en blanco.
  //   - NOT_FOUND: el repartidor no existe.
  //   - FAILED_PRECONDITION: el repartidor está inactivo, está OFFLINE (el
  //     dominio devuelve ErrDriverOffline) o ya está reservado para otra ruta.
  //
  // En FAILED_PRECONDITION el mensaje del error distingue cuál de las tres causas
  // ocurrió.
  rpc ReserveDriver(ReserveDriverRequest) returns (ReserveDriverResponse);

  // GetDriverByUserID devuelve el repartidor asociado a un user_id de Auth Service. Lo usa el
  // Gateway para resolver GET /drivers/me.
  //
  // Códigos de estado gRPC que el servidor debe devolver:
  //
  //   - INVALID_ARGUMENT: user_id en blanco.
  //   - NOT_FOUND: ningún repartidor tiene ese user_id.
  rpc GetDriverByUserID(GetDriverByUserIDRequest) returns (GetDriverByUserIDResponse);

  // RegisterDelivery guarda el resultado de una parada (ADR 0007, sección 4) y su verificación
  // de llegada. El repartidor debe estar ON_ROUTE en route_id.
  //
  // La dirección y la ventana de la parada NO las envía el llamador: el servidor las obtiene de
  // la fuente de paradas del Routing Service. Mientras esa fuente no esté configurada, responde
  // UNIMPLEMENTED. Así el cliente no puede declarar una ubicación de parada y falsear la llegada.
  //
  // Códigos de estado gRPC que el servidor debe devolver:
  //
  //   - INVALID_ARGUMENT: campos obligatorios en blanco, outcome o reason fuera de la lista,
  //     coordenadas fuera de rango o recorded_at que no es RFC 3339.
  //   - NOT_FOUND: el repartidor o la parada no existen.
  //   - FAILED_PRECONDITION: el repartidor no está ON_ROUTE en esa ruta.
  //   - ALREADY_EXISTS: la parada ya tiene un registro en esa ruta.
  //   - UNIMPLEMENTED: la fuente de paradas aún no existe.
  rpc RegisterDelivery(RegisterDeliveryRequest) returns (RegisterDeliveryResponse);

  // CreateDriver registra el perfil de un repartidor cuyo usuario DRIVER ya existe en Auth
  // Service. El repartidor nace activo y AVAILABLE. Devuelve el perfil completo, que incluye
  // datos personales (fecha de nacimiento, identificador): solo lo debe leer quien registra.
  //
  // Códigos de estado gRPC que el servidor debe devolver:
  //
  //   - INVALID_ARGUMENT: algún campo en blanco o con formato inválido, tipo de vehículo fuera
  //     de la lista, o menor de 18 años.
  //   - ALREADY_EXISTS: el usuario, el identificador o la placa ya pertenecen a otro repartidor.
  rpc CreateDriver(CreateDriverRequest) returns (CreateDriverResponse);

  // ListDrivers devuelve la flota para el personal de la web: activos e inactivos, en cualquier
  // estado, ordenados por apellido y nombre. Cada elemento omite fecha de nacimiento e
  // identificador (minimización de datos). Devuelve como máximo 500 repartidores.
  rpc ListDrivers(ListDriversRequest) returns (ListDriversResponse);
}

enum DriverStatus {
  DRIVER_STATUS_UNSPECIFIED = 0;
  DRIVER_STATUS_AVAILABLE = 1;
  DRIVER_STATUS_ASSIGNED = 2;
  DRIVER_STATUS_ON_ROUTE = 3;
  DRIVER_STATUS_OFFLINE = 4;
}

enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  VEHICLE_TYPE_MOTORBIKE = 1; // MOTORIZADO
  VEHICLE_TYPE_CAR = 2; // AUTOMOVIL
  VEHICLE_TYPE_SUV = 3; // SUV
}

message Driver {
  string id = 1;
  // Identificador del usuario en Auth Service con rol DRIVER.
  string user_id = 2;
  string full_name = 3;
  string phone = 4;
  bool active = 5;
  DriverStatus status = 6;
  // RFC 3339, UTC.
  string created_at = 7;
}

// DriverSummary es la vista mínima de un repartidor disponible. El Routing Service
// solo necesita los identificadores para elegir y reservar un repartidor, por lo que
// no se exponen el nombre ni el teléfono (minimización de datos).
message DriverSummary {
  string id = 1;
  // Identificador del usuario en Auth Service con rol DRIVER.
  string user_id = 2;
}

message FindAvailableDriversRequest {
  // Cantidad máxima de repartidores a devolver. Cero usa el valor por defecto del
  // servicio (50). El máximo es 100: un valor mayor se limita a 100 y no es un error.
  // Un valor negativo falla con INVALID_ARGUMENT.
  int32 limit = 1;
}

message FindAvailableDriversResponse {
  repeated DriverSummary drivers = 1;
}

message ReserveDriverRequest {
  // Obligatorio; no puede estar en blanco.
  string driver_id = 1;
  // Ruta para la que se reserva; obligatorio. Junto con driver_id identifica la
  // reserva a efectos de idempotencia.
  string route_id = 2;
}

message ReserveDriverResponse {
  // Repartidor ya reservado (estado ASSIGNED). A diferencia de FindAvailableDrivers,
  // incluye el nombre y el teléfono a propósito: al entregar, el repartidor debe poder
  // contactar al cliente y el cliente al repartidor. Solo se expone a quien reserva,
  // nunca a clientes finales.
  Driver driver = 1;
}

message GetDriverByUserIDRequest {
  // Identificador del usuario en Auth Service con rol DRIVER; obligatorio.
  string user_id = 1;
}

message GetDriverByUserIDResponse {
  DriverSummary driver = 1;
}

message RegisterDeliveryRequest {
  // Repartidor que registra; obligatorio.
  string driver_id = 1;
  // Ruta de la parada; obligatoria.
  string route_id = 2;
  // Parada; obligatoria.
  string stop_id = 3;
  // "DELIVERED" o "NOT_DELIVERED".
  string outcome = 4;
  // Motivo de la lista cerrada: obligatorio con NOT_DELIVERED y vacío con DELIVERED.
  string reason = 5;
  // Momento del registro, RFC 3339.
  string recorded_at = 6;
  // Posición GPS del repartidor al registrar. Grados decimales.
  double latitude = 7;
  double longitude = 8;
  // Opcional: URL de la foto, vacía si no hay.
  string photo_url = 9;
}

message RegisterDeliveryResponse {
  string stop_id = 1;
  string outcome = 2;
  string reason = 3;
  // Verificación de llegada que el motor de penalizaciones lee.
  bool within_radius = 4;
  bool within_window = 5;
  double distance_meters = 6;
}

message CreateDriverRequest {
  // Usuario de Auth Service con rol DRIVER; obligatorio y único.
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  // YYYY-MM-DD. El repartidor debe tener al menos 18 años.
  string birth_date = 4;
  // Número de contacto: 7 a 15 dígitos y un + opcional al inicio.
  string phone = 5;
  VehicleType vehicle_type = 6;
  // Documento de identidad: 5 a 20 letras o dígitos; único.
  string identifier = 7;
  // Placa del vehículo: 5 a 8 letras o dígitos, sin guiones; única.
  string plate = 8;
  string city = 9;
}

// DriverProfile es el perfil completo de un repartidor. Contiene datos personales: no se
// reutiliza en respuestas que consumen otros servicios (por eso Driver no lo incluye).
message DriverProfile {
  string id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  // YYYY-MM-DD.
  string birth_date = 5;
  string phone = 6;
  VehicleType vehicle_type = 7;
  string identifier = 8;
  string plate = 9;
  string city = 10;
  bool active = 11;
  DriverStatus status = 12;
  // RFC 3339, UTC.
  string created_at = 13;
}

message CreateDriverResponse {
  DriverProfile driver = 1;
}

message ListDriversRequest {}

message DriverListItem {
  string id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  string city = 6;
  VehicleType vehicle_type = 7;
  string plate = 8;
  bool active = 9;
  DriverStatus status = 10;
}

message ListDriversResponse {
  repeated DriverListItem drivers = 1;
}
